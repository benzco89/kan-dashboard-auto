<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כאן חדשות · סושיאל — סקירה כללית</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="header"></header>
<main id="main" class="main"></main>
<script src="/static/app.js"></script>
<script>
(function () {
  var PIC = { youtube: { c: "var(--yt)", icon: "yt" }, facebook: { c: "var(--fb)", icon: "fb" }, instagram: { c: "var(--ig)", icon: "ig" } };

  function follCard(f) {
    var up = f.weekly_change >= 0;
    return '<div class="card foll"><div class="foll-top"><span class="foll-ic" style="background:' + f.bg + ';">' + KS.fillIcon(f.icon, f.color) + '</span>' +
      '<div style="min-width:0;flex:1;"><div class="foll-label">' + f.label + '</div><div class="foll-val">' + KS.fmt(f.value) + '</div></div></div>' +
      '<div class="foll-change ' + (up ? "up" : "down") + '">' + (up ? "▲" : "▼") + " " + KS.signed(f.weekly_change) + '<span class="sub"> השבוע</span></div></div>';
  }
  function kpiCard(k) {
    var d = KS.delta(k.value, k.prev);
    return '<div class="kpi"><div class="kpi-top"><div class="kpi-label">' + k.label + '</div>' +
      '<span class="kpi-ic" style="background:' + k.bg + ";color:" + k.color + ';">' + KS.strokeIcon(k.icon) + '</span></div>' +
      '<div class="kpi-val">' + KS.fmt(k.value) + '</div>' +
      '<div class="kpi-delta ' + d.cls + '">' + d.arrow + " " + d.txt + '<span class="sub">מהתקופה הקודמת</span></div></div>';
  }
  function pcard(p) {
    return '<a class="pcard" href="' + p.href + '" style="--c:' + p.color + ';">' +
      '<div class="pcard-head"><span class="pcard-ic" style="background:' + p.bg + ';">' + KS.fillIcon(p.icon, p.color, 17) + '</span>' +
      '<span class="pcard-name">' + p.name + '</span><span class="spacer"></span><span class="pcard-more">פירוט ←</span></div>' +
      '<div class="pcard-stats"><div><div class="k">עוקבים</div><div class="v">' + KS.fmt(p.followers) + '</div></div>' +
      '<div><div class="k">צפיות בתקופה</div><div class="v">' + KS.fmt(p.views) + '</div></div></div>' +
      KS.sparkSvg(p.spark, p.color) + '</a>';
  }
  function topRow(c, i) {
    var p = PIC[c.platform];
    return '<a class="toprow" href="' + KS.esc(c.url || "#") + '" target="_blank" rel="noopener">' +
      '<span class="rank">' + (i + 1) + '</span>' +
      '<span class="pic" style="background:' + p.c + ';">' + KS.fillIcon(p.icon, "#fff", 16) + '</span>' +
      '<span class="txt"><span class="title">' + KS.esc(c.title || "(ללא כותרת)") + '</span>' +
      '<span class="meta">' + KS.fmt(c.views) + " צפיות · " + KS.esc(c.type) + '</span></span>' +
      '<span class="tag" style="color:' + p.c + ';">' + KS.esc(c.type) + '</span></a>';
  }

  function render(data, app) {
    var rl = KS.RANGE_LABEL[data.range];
    var foll = [
      follCard({ label: "YouTube", value: data.followers.youtube.value, weekly_change: data.followers.youtube.weekly_change, icon: "yt", color: "var(--yt)", bg: "var(--yt-bg)" }),
      follCard({ label: "Facebook", value: data.followers.facebook.value, weekly_change: data.followers.facebook.weekly_change, icon: "fb", color: "var(--fb)", bg: "var(--fb-bg)" }),
      follCard({ label: "Instagram", value: data.followers.instagram.value, weekly_change: data.followers.instagram.weekly_change, icon: "ig", color: "var(--ig)", bg: "var(--ig-bg)" }),
      follCard({ label: "סה״כ עוקבים", value: data.followers.total.value, weekly_change: data.followers.total.weekly_change, icon: "users", color: "var(--orange)", bg: "var(--orange-bg)" })
    ].join("");

    var kpis = [
      kpiCard({ label: "צפיות", value: data.kpis.views.value, prev: data.kpis.views.prev, icon: "eye", color: "var(--purp)", bg: "var(--purp-bg)" }),
      kpiCard({ label: "חשיפה", value: data.kpis.reach.value, prev: data.kpis.reach.prev, icon: "reach", color: "var(--blue)", bg: "var(--blue-bg)" }),
      kpiCard({ label: "אינטראקציות", value: data.kpis.interactions.value, prev: data.kpis.interactions.prev, icon: "heart", color: "var(--orange)", bg: "var(--orange-bg)" }),
      kpiCard({ label: "תכנים", value: data.kpis.content.value, prev: data.kpis.content.prev, icon: "video", color: "var(--teal)", bg: "var(--teal-bg)" })
    ].join("");

    var chart = KS.lineSvg({
      dates: data.chart.dates, vbW: 720, vbH: 240,
      series: [
        { color: "var(--yt)", data: data.chart.youtube },
        { color: "var(--fb)", data: data.chart.facebook },
        { color: "var(--ig)", data: data.chart.instagram }
      ]
    });
    var legend = '<div class="legend">' +
      '<span><span class="dot" style="background:var(--yt);"></span>YouTube</span>' +
      '<span><span class="dot" style="background:var(--fb);"></span>Facebook</span>' +
      '<span><span class="dot" style="background:var(--ig);"></span>Instagram</span></div>';

    var platforms = [
      pcard({ name: "YouTube", color: "var(--yt)", bg: "var(--yt-bg)", icon: "yt", href: "/youtube", followers: data.platforms.youtube.followers, views: data.platforms.youtube.views, spark: data.platforms.youtube.spark }),
      pcard({ name: "Facebook", color: "var(--fb)", bg: "var(--fb-bg)", icon: "fb", href: "/facebook", followers: data.platforms.facebook.followers, views: data.platforms.facebook.views, spark: data.platforms.facebook.spark }),
      pcard({ name: "Instagram", color: "var(--ig)", bg: "var(--ig-bg)", icon: "ig", href: "/instagram", followers: data.platforms.instagram.followers, views: data.platforms.instagram.views, spark: data.platforms.instagram.spark })
    ].join("");

    var top = data.top_content.length ? data.top_content.map(topRow).join("") : '<div style="padding:24px;text-align:center;color:var(--muted);">אין תכנים בטווח שנבחר</div>';

    var insight = data.insight.paragraphs.length
      ? data.insight.paragraphs.map(function (p) { return "<p>" + KS.esc(p) + "</p>"; }).join("")
      : '<p style="color:var(--muted);">אין תובנה זמינה</p>';

    var q = data.quick;
    var quick = [
      { v: q.avg_engagement.toFixed(2) + "%", l: "ממוצע מעורבות" },
      { v: KS.fmt(q.total_reach), l: "חשיפה כוללת" },
      { v: "" + q.yt_videos, l: "סרטוני YouTube" },
      { v: "" + q.fb_ig_posts, l: "פוסטים FB + IG" }
    ].map(function (x) { return '<div><div class="v">' + x.v + '</div><div class="l">' + x.l + "</div></div>"; }).join("");

    document.getElementById("main").innerHTML =
      '<div class="page-head"><div><h1>סקירת ביצועים</h1>' +
      '<p>סיכום ביצועי הסושיאל בכל הפלטפורמות · ' + rl + '</p></div>' +
      '<div style="text-align:left;"><div class="asof-label">נתונים עד</div><div class="asof-date">' + KS.fmtFullDate(data.last_date) + '</div></div></div>' +

      '<div class="section-label"><span>עוקבים</span><span></span></div>' +
      '<div class="grid-4 mb">' + foll + '</div>' +

      '<div class="section-label"><span>ביצועים בתקופה</span><span></span></div>' +
      '<div class="grid-4 mb">' + kpis + '</div>' +

      '<div class="panel mb chart"><div class="panel-head"><div><div class="panel-title">צפיות לפי פלטפורמה</div>' +
      '<div class="panel-sub">צפיות יומיות · ' + rl + '</div></div>' + legend + '</div>' + chart + '</div>' +

      '<div class="section-label"><span>פירוט לפי פלטפורמה</span><span></span></div>' +
      '<div class="grid-3 mb">' + platforms + '</div>' +

      '<div class="split" style="display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;align-items:start;">' +
        '<div class="card" style="padding:6px 8px 8px;"><div class="toplist-head"><span class="panel-title">תכנים מובילים</span>' +
        '<span style="font-family:ui-monospace,monospace;font-size:11px;color:var(--faint);">לפי צפיות · ' + rl + '</span></div>' + top + '</div>' +
        '<div style="display:flex;flex-direction:column;gap:12px;">' +
          '<div class="insight"><div class="insight-head"><span class="insight-ic">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="stroke:var(--orange);" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>' +
            '</span><span class="panel-title" style="font-size:15px;">תובנות AI יומיות</span><span class="spacer"></span>' +
            '<span style="font-family:ui-monospace,monospace;font-size:11px;color:var(--faint);">' + KS.fmtFullDate(data.insight.date) + '</span></div>' + insight + '</div>' +
          '<div class="card" style="padding:6px 16px 14px;"><div style="font-weight:700;font-size:15px;padding:11px 0;border-bottom:1px solid var(--line);">נתונים נוספים</div>' +
          '<div class="quick-grid">' + quick + '</div></div>' +
        '</div>' +
      '</div>';
  }

  KanSocial.init("overview", render);
})();
</script>
</body>
</html>
