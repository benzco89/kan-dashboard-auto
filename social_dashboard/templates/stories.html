<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כאן חדשות · סושיאל — סטוריז</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="header"></header>
<main id="main" class="main"></main>
<script src="/static/app.js"></script>
<script>
(function () {
  var IG_GRAD = "linear-gradient(135deg,#feda75,#d62976 45%,#962fbf 80%)";
  var NAV_META = [
    { key: "taps_back", label: "חזרה אחורה", hint: "צפייה חוזרת · עניין", color: "var(--ok)" },
    { key: "taps_forward", label: "דילוג קדימה", hint: "קפצו לסטורי הבא", color: "var(--amber)" },
    { key: "swipes_forward", label: "מעבר לחשבון הבא", hint: "נטשו את הרצף", color: "var(--bad)" },
    { key: "exits", label: "יציאה", hint: "סגרו את הסטוריז", color: "var(--muted)" }
  ];

  function kcard(label, valueHtml, sub) {
    return '<div class="kpi pf sm"><div class="kpi-top"><div class="kpi-label">' + label + '</div></div>' +
      '<div class="kpi-val">' + valueHtml + '</div>' +
      (sub ? '<div class="kpi-delta" style="color:var(--muted);">' + sub + '</div>' : '') + '</div>';
  }
  function stat(v, l) { return '<div class="stat"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>'; }

  function render(data, app) {
    var rl = KS.RANGE_LABEL[data.range];
    var k = data.kpis, s = data.summary;
    var stories = data.stories || [];

    var kpis = [
      kcard("סטוריז", "" + k.stories, "בטווח שנבחר"),
      kcard("צפיות", KS.fmtHtml(k.views), "ממוצע " + KS.fmt(s.avg_views) + " לסטורי"),
      kcard("חשיפה", KS.fmtHtml(k.reach), "ממוצע " + KS.fmt(s.avg_reach) + " לסטורי"),
      kcard("ביקורי פרופיל", KS.fmtHtml(k.profile_visits), s.follows + " עוקבים חדשים")
    ].join("");

    var chart = KS.chart({
      dates: data.chart.dates, vbW: 700, vbH: 230,
      series: [
        { color: "var(--reach)", data: data.chart.reach, name: "חשיפה" },
        { color: "var(--pf)", data: data.chart.views, name: "צפיות" }
      ]
    });
    var legend = '<div class="legend"><span><span class="dot" style="background:var(--pf);"></span>צפיות</span>' +
      '<span><span class="dot" style="background:var(--reach);"></span>חשיפה</span></div>';

    // navigation breakdown — what viewers did during each story
    var navTotal = NAV_META.reduce(function (a, m) { return a + (data.nav[m.key] || 0); }, 0) || 1;
    var navBars = NAV_META.map(function (m) {
      var v = data.nav[m.key] || 0;
      return '<div class="typebar"><div class="typebar-top"><span class="typebar-name">' + m.label +
        '<span class="cnt">' + m.hint + '</span></span><span class="typebar-val">' + KS.fmt(v) + '</span></div>' +
        '<span class="typebar-track"><span class="typebar-fill" style="width:' + Math.round(v / navTotal * 100) + '%;background:' + m.color + ';"></span></span></div>';
    }).join("");
    var navPanel = '<div class="panel"><div class="panel-title">ניווט בסטוריז</div>' +
      '<div class="panel-sub" style="margin-bottom:14px;">מה הצופים עשו · שיעור נטישה ממוצע ' +
      '<b style="color:' + (s.avg_exit_rate > 20 ? "var(--bad)" : "var(--ok)") + ';">' + s.avg_exit_rate.toFixed(1) + '%</b></div>' + navBars + '</div>';

    var summary = [
      stat(s.avg_exit_rate.toFixed(1) + "%", "שיעור נטישה ממוצע"),
      stat(KS.fmt(s.profile_visits), "ביקורי פרופיל"),
      stat("" + s.follows, "עוקבים חדשים"),
      stat(KS.fmt(s.replies), "תגובות"),
      stat(KS.fmt(s.shares), "שיתופים")
    ].join("");

    var meanV = stories.length ? stories.reduce(function (a, v) { return a + v.views; }, 0) / stories.length : 0;
    var cols = "40px 1fr 78px 90px 90px 104px 84px";
    var thd = function (key, label) { return '<span class="center th-sort" data-sk="' + key + '" style="cursor:pointer;user-select:none;">' + label + '<span class="sk-ar"></span></span>'; };
    var thead = '<div class="thead" id="thead" style="display:grid;grid-template-columns:' + cols + ';gap:10px;"><span class="center">#</span><span>סטורי</span>' +
      thd("type", "סוג") + thd("views", "צפיות") + thd("reach", "חשיפה") + thd("profile_visits", "ביקורי פרופיל") + thd("exit_rate", "נטישה%") + '</div>';
    var LIMIT = 40;
    var displayList = [];

    function medOf(key) {
      var xs = stories.map(function (x) { return Number(x[key]) || 0; }).filter(function (v) { return v > 0; }).sort(function (a, b) { return a - b; });
      if (!xs.length) return 0;
      var m = Math.floor(xs.length / 2);
      return xs.length % 2 ? xs[m] : (xs[m - 1] + xs[m]) / 2;
    }
    function openStoryModal(st) {
      var mv = medOf("views");
      var hero = '<div class="km-hero">' +
        '<div><div class="v">' + KS.fmtHtml(st.views) + '</div><div class="l">צפיות</div></div>' +
        '<div><div class="v">' + KS.fmtHtml(st.reach) + '</div><div class="l">חשיפה</div></div>' +
        '<div><div class="v">' + st.exit_rate.toFixed(1) + '%</div><div class="l">נטישה</div></div></div>';
      var navSec = KS.kmSection("ניווט") + '<div class="km-grid">' +
        KS.kmCell("חזרה אחורה", KS.fmtHtml(st.taps_back)) +
        KS.kmCell("דילוג קדימה", KS.fmtHtml(st.taps_forward)) +
        KS.kmCell("מעבר לחשבון הבא", KS.fmtHtml(st.swipes_forward)) +
        KS.kmCell("יציאה", KS.fmtHtml(st.exits)) + '</div>';
      var conv = KS.kmSection("המרה ומעורבות") + '<div class="km-grid">' +
        KS.kmCell("ביקורי פרופיל", KS.fmtHtml(st.profile_visits)) +
        KS.kmCell("עוקבים חדשים", KS.fmtHtml(st.follows)) +
        KS.kmCell("תגובות", KS.fmtHtml(st.replies)) +
        KS.kmCell("שיתופים", KS.fmtHtml(st.shares)) +
        (st.pv_rate ? KS.kmCell("% ביקורי פרופיל", st.pv_rate.toFixed(2) + "%") : "") + '</div>';
      var cmp = mv ? (KS.kmSection("ביחס לטיפוסי בסטוריז") + '<div class="km-cmp">' + KS.kmCmp("צפיות מול חציון", st.views / mv) + '</div>') : "";
      var openBtn = st.url ? '<a class="km-open" href="' + KS.esc(st.url) + '" target="_blank" rel="noopener">פתח באינסטגרם ↗</a>' : "";
      KS.openModal({
        iconHtml: KS.fillIcon("ig", "#fff", 19), iconBg: IG_GRAD,
        type: "Instagram Story · " + (st.type === "Video" ? "וידאו" : "תמונה"),
        title: "סטורי · " + (st.time || ""), date: KS.fmtFullDate(st.date),
        bodyHtml: hero + navSec + conv + cmp + openBtn
      });
    }

    var TYPE_HE = { Video: "וידאו", Image: "תמונה" };
    var rowOf = function (st, idx) {
      var rank = idx + 1;
      var rankStyle = rank <= 3 ? "color:var(--pf);font-weight:700;" : "color:var(--faint);";
      var hlV = st.views > 2 * meanV;
      var hl = hlV ? "border-inline-start-color:var(--hi-views);background:var(--hi-views-bg);" : "";
      return '<a class="trow" href="' + KS.esc(st.url || "#") + '" target="_blank" rel="noopener" data-idx="' + idx + '" style="display:grid;grid-template-columns:' + cols + ';gap:10px;' + hl + '">' +
        '<span class="cell" style="' + rankStyle + '">' + rank + '</span>' +
        '<span style="min-width:0;"><span class="t-title">סטורי · ' + KS.esc(st.time) + '</span><span class="t-date">' + KS.fmtDate(st.date) + '</span></span>' +
        '<span class="center"><span class="tag" style="color:var(--pf);">' + (TYPE_HE[st.type] || st.type) + '</span></span>' +
        '<span class="cell strong">' + KS.fmt(st.views) + '</span>' +
        '<span class="cell">' + KS.fmt(st.reach) + '</span>' +
        '<span class="cell">' + KS.fmt(st.profile_visits) + '</span>' +
        '<span class="cell strong">' + st.exit_rate.toFixed(1) + '%</span></a>';
    };
    var sortState = { key: "views", dir: "desc" };
    function cmpFn(a, b) {
      var key = sortState.key, dir = sortState.dir === "asc" ? 1 : -1;
      if (key === "type") return dir * String(a.type || "").localeCompare(String(b.type || ""));
      return dir * ((Number(a[key]) || 0) - (Number(b[key]) || 0));
    }
    function buildRows(list) {
      displayList = list;
      if (!list.length) return '<div style="padding:24px;text-align:center;color:var(--muted);">אין סטוריז בטווח שנבחר</div>';
      var html = list.slice(0, LIMIT).map(function (st, i) { return rowOf(st, i); }).join("");
      if (list.length > LIMIT) html += '<div id="tbl-more" style="display:none">' + list.slice(LIMIT).map(function (st, i) { return rowOf(st, i + LIMIT); }).join("") + '</div><button id="tbl-showall" class="showall-btn">הצג את כל ' + list.length + ' הסטוריז ↓</button>';
      return html;
    }
    var rows = buildRows(stories.slice().sort(cmpFn));

    document.getElementById("main").innerHTML =
      '<div class="platform-head"><span class="pf-icon" style="background:' + IG_GRAD + ';">' + KS.fillIcon("ig", "#fff", 24) + '</span>' +
      '<div><h1>Instagram Stories</h1><p>ניתוח סטוריז של כאן חדשות · ' + rl + ' · נאספים פעם ביום (רק סטוריז שהיו חיים באיסוף)</p></div></div>' +

      '<div class="grid-4 mb-s">' + kpis + '</div>' +

      '<div class="split" style="display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;margin-bottom:14px;align-items:start;">' +
        '<div class="panel chart"><div class="panel-head"><div><div class="panel-title">צפיות וחשיפה לאורך זמן</div><div class="panel-sub">מדדים יומיים</div></div>' + legend + '</div>' + chart + '</div>' +
        navPanel +
      '</div>' +

      '<div class="grid-5 mb-m">' + summary + '</div>' +

      '<div class="table"><div class="table-head"><div><div class="panel-title">סטוריז מדורגים לפי צפיות</div>' +
      '<div class="panel-sub">' + k.stories + ' סטוריז · ' + rl + ' · לחצו על סטורי לפירוט מלא</div></div>' +
      '<div class="table-legend"><span><span class="sq" style="background:var(--hi-views);"></span>צפיות גבוהות</span></div></div>' +
      '<div class="table-scroll">' + thead + '<div id="tbl-body">' + rows + '</div></div></div>';
    KS.wireCharts();
    function wireShowAll() {
      var sa = document.getElementById("tbl-showall");
      if (sa) sa.addEventListener("click", function () { document.getElementById("tbl-more").style.display = ""; sa.style.display = "none"; });
    }
    wireShowAll();
    var tblBody = document.getElementById("tbl-body");
    tblBody.addEventListener("click", function (e) {
      var row = e.target.closest(".trow"); if (!row) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
      e.preventDefault();
      var idx = parseInt(row.getAttribute("data-idx"), 10);
      if (!isNaN(idx) && displayList[idx]) openStoryModal(displayList[idx]);
    });
    function renderBody() { tblBody.innerHTML = buildRows(stories.slice().sort(cmpFn)); wireShowAll(); }
    function refreshHeader() {
      document.querySelectorAll("#thead [data-sk]").forEach(function (h) {
        var ar = h.querySelector(".sk-ar");
        if (ar) ar.textContent = h.getAttribute("data-sk") === sortState.key ? (sortState.dir === "desc" ? " ▼" : " ▲") : "";
      });
    }
    document.querySelectorAll("#thead [data-sk]").forEach(function (h) {
      h.addEventListener("click", function () {
        var key = h.getAttribute("data-sk");
        if (sortState.key === key) sortState.dir = sortState.dir === "desc" ? "asc" : "desc";
        else { sortState.key = key; sortState.dir = "desc"; }
        renderBody(); refreshHeader();
      });
    });
    refreshHeader();
  }

  KanSocial.init("stories", render);
})();
</script>
</body>
</html>
