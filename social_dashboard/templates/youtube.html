<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כאן חדשות · סושיאל — YouTube</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="header"></header>
<main id="main" class="main"></main>
<script src="/static/app.js"></script>
<script>
(function () {
  function kpi(k) {
    var inner;
    if (k.weekly !== undefined) {
      var up = k.weekly >= 0;
      inner = '<div class="kpi-delta ' + (up ? "up" : "down") + '">' + (up ? "▲" : "▼") + " " + KS.signed(k.weekly) + (k.growth ? ' · ' + Math.abs(k.growth).toFixed(1) + '%' : '') + '<span class="sub">השבוע</span></div>';
    } else {
      var d = KS.delta(k.value, k.prev);
      inner = '<div class="kpi-delta ' + d.cls + '">' + d.arrow + " " + d.txt + '<span class="sub">מהתקופה הקודמת</span></div>';
    }
    return '<div class="kpi pf sm"><div class="kpi-top"><div class="kpi-label">' + k.label + '</div>' +
      '<span class="kpi-ic" style="background:var(--pf-bg);color:var(--pf);">' + KS.strokeIcon(k.icon) + '</span></div>' +
      '<div class="kpi-val">' + KS.fmtHtml(k.value) + '</div>' + inner + '</div>';
  }
  function stat(v, l) { return '<div class="stat"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>'; }

  function render(data, app) {
    var rl = KS.RANGE_LABEL[data.range];
    var k = data.kpis;
    var kpis = [
      kpi({ label: "מנויים", value: data.subscribers.value, weekly: data.subscribers.weekly_change, growth: data.subscribers.growth_pct, icon: "users" }),
      kpi({ label: "צפיות", value: k.views.value, prev: k.views.prev, icon: "eye" }),
      kpi({ label: "לייקים", value: k.likes.value, prev: k.likes.prev, icon: "like" }),
      kpi({ label: "תגובות", value: k.comments.value, prev: k.comments.prev, icon: "comment" })
    ].join("");

    var chart = KS.chart({ dates: data.chart.dates, vbW: 700, vbH: 230, area: true, series: [{ color: "var(--pf)", data: data.chart.views, w: 2.6, name: "צפיות" }] });

    var totV = data.donut.shorts_views + data.donut.regular_views;
    function pct(v) { return totV ? Math.round(v / totV * 100) + "%" : "0%"; }
    var donut = KS.donutSvg(
      [{ color: "var(--pf)", value: data.donut.shorts_views }, { color: "var(--muted)", value: data.donut.regular_views }],
      data.summary.total, "סרטונים");
    var dLegend =
      '<div class="donut-legend"><span class="sq" style="background:var(--pf);"></span><span class="name">Shorts</span><span class="val">' + KS.fmt(data.donut.shorts_views) + " · " + pct(data.donut.shorts_views) + '</span></div>' +
      '<div class="donut-legend"><span class="sq" style="background:var(--muted);"></span><span class="name">סרטונים רגילים</span><span class="val">' + KS.fmt(data.donut.regular_views) + " · " + pct(data.donut.regular_views) + '</span></div>';

    var s = data.summary;
    var summary = [stat("" + s.total, "סה״כ סרטונים"), stat("" + s.shorts, "Shorts"), stat("" + s.regular, "סרטונים רגילים"), stat(s.avg_engagement.toFixed(2) + "%", "ממוצע מעורבות")].join("");

    var vids = data.videos;
    vids.forEach(function (v) { v.eng = v.engagement; });
    var meanV = vids.length ? vids.reduce(function (a, v) { return a + v.views; }, 0) / vids.length : 0;
    var meanE = vids.length ? vids.reduce(function (a, v) { return a + v.likes + v.comments; }, 0) / vids.length : 0;
    var cols = "40px 1fr 80px 92px 84px 84px 78px 86px";
    var thd = function (key, label) { return '<span class="center th-sort" data-sk="' + key + '" style="cursor:pointer;user-select:none;">' + label + '<span class="sk-ar"></span></span>'; };
    var thead = '<div class="thead" id="thead" style="display:grid;grid-template-columns:' + cols + ';gap:10px;"><span class="center">#</span><span>כותרת</span>' +
      thd("type", "סוג") + thd("views", "צפיות") + thd("likes", "לייקים") + thd("comments", "תגובות") + thd("like_rate", "% לייקים") + thd("eng", "% מעורבות") + '</div>';
    var LIMIT = 40;
    var rowOf = function (v, idx) {
      var rank = idx + 1;
      var rankStyle = rank <= 3 ? "color:var(--pf);font-weight:700;" : "color:var(--faint);";
      var hlV = v.views > 2 * meanV, hlE = !hlV && (v.likes + v.comments) > 2 * meanE;
      var hl = hlV ? "border-inline-start-color:var(--hi-views);background:var(--hi-views-bg);" : (hlE ? "border-inline-start-color:var(--hi-alt);background:var(--hi-alt-bg);" : "");
      var isShort = v.type === "Short";
      var tagStyle = isShort ? "color:var(--pf);border-color:var(--pf);" : "color:var(--muted);";
      return '<a class="trow" href="' + KS.esc(v.url || "#") + '" target="_blank" rel="noopener" style="display:grid;grid-template-columns:' + cols + ';gap:10px;' + hl + '">' +
        '<span class="cell" style="' + rankStyle + '">' + rank + '</span>' +
        '<span style="min-width:0;"><span class="t-title">' + KS.esc(v.title) + '</span><span class="t-date">' + KS.fmtDate(v.date) + '</span></span>' +
        '<span class="center"><span class="tag" style="' + tagStyle + '">' + v.type + '</span></span>' +
        '<span class="cell strong">' + KS.fmt(v.views) + '</span>' +
        '<span class="cell">' + KS.fmt(v.likes) + '</span>' +
        '<span class="cell">' + KS.fmt(v.comments) + '</span>' +
        '<span class="cell">' + v.like_rate.toFixed(1) + '%</span>' +
        '<span class="cell strong">' + v.eng.toFixed(1) + '%</span></a>';
    };
    var ENG_KEY = "eng";
    var sortState = { key: ENG_KEY, dir: "desc" };
    function cmpFn(a, b) {
      var k = sortState.key, dir = sortState.dir === "asc" ? 1 : -1;
      if (k === "type") return dir * String(a.type || "").localeCompare(String(b.type || ""));
      return dir * ((Number(a[k]) || 0) - (Number(b[k]) || 0));
    }
    function buildRows(list) {
      if (!list.length) return '<div style="padding:24px;text-align:center;color:var(--muted);">אין סרטונים בטווח שנבחר</div>';
      var html = list.slice(0, LIMIT).map(function (v, i) { return rowOf(v, i); }).join("");
      if (list.length > LIMIT) html += '<div id="tbl-more" style="display:none">' + list.slice(LIMIT).map(function (v, i) { return rowOf(v, i + LIMIT); }).join("") + '</div><button id="tbl-showall" class="showall-btn">הצג את כל ' + list.length + ' הסרטונים ↓</button>';
      return html;
    }
    var rows = buildRows(vids.slice().sort(cmpFn));

    document.getElementById("main").innerHTML =
      '<div class="platform-head"><span class="pf-icon" style="background:var(--pf);">' + KS.fillIcon("yt", "#fff", 24) + '</span>' +
      '<div><h1>YouTube Analytics</h1><p>ניתוח ביצועי ערוץ היוטיוב של כאן חדשות · ' + rl + '</p></div></div>' +

      '<div class="grid-4 mb-s">' + kpis + '</div>' +

      '<div class="split" style="display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;margin-bottom:14px;">' +
        '<div class="panel chart"><div class="panel-head"><div><div class="panel-title">צפיות לאורך זמן</div><div class="panel-sub">צפיות יומיות בסרטונים</div></div>' +
        '<span class="legend"><span><span class="dot" style="background:var(--pf);"></span>צפיות</span></span></div>' + chart + '</div>' +
        '<div class="panel"><div class="panel-title">סוג תוכן</div><div class="panel-sub">Shorts מול סרטונים רגילים</div>' +
        '<div style="display:flex;align-items:center;justify-content:center;margin:8px 0 12px;">' + donut + '</div>' + dLegend + '</div>' +
      '</div>' +

      '<div class="grid-4 mb-m">' + summary + '</div>' +

      '<div class="table"><div class="table-head"><div><div class="panel-title">סרטונים מדורגים לפי מעורבות</div>' +
      '<div class="panel-sub">' + data.summary.total + ' סרטונים · ' + rl + '</div></div>' +
      '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">' +
      '<div id="rank-toggle" class="ranges" style="padding:2px;"><button class="range active" data-rk="top">מצליחים ביותר</button><button class="range" data-rk="bottom">פחות מצליחים</button></div>' +
      '<div class="table-legend"><span><span class="sq" style="background:var(--hi-views);"></span>צפיות גבוהות</span>' +
      '<span><span class="sq" style="background:var(--hi-alt);"></span>מעורבות גבוהה</span></div></div></div>' +
      '<div class="table-scroll">' + thead + '<div id="tbl-body">' + rows + '</div></div></div>';
    KS.wireCharts();
    function wireShowAll() {
      var sa = document.getElementById("tbl-showall");
      if (sa) sa.addEventListener("click", function () { document.getElementById("tbl-more").style.display = ""; sa.style.display = "none"; });
    }
    wireShowAll();
    var tblBody = document.getElementById("tbl-body");
    function renderBody() { tblBody.innerHTML = buildRows(vids.slice().sort(cmpFn)); wireShowAll(); }
    function refreshHeader() {
      document.querySelectorAll("#thead [data-sk]").forEach(function (h) {
        var ar = h.querySelector(".sk-ar");
        if (ar) ar.textContent = h.getAttribute("data-sk") === sortState.key ? (sortState.dir === "desc" ? " ▼" : " ▲") : "";
      });
      var t = document.querySelector('#rank-toggle [data-rk="top"]'), b = document.querySelector('#rank-toggle [data-rk="bottom"]');
      if (t && b) { t.classList.remove("active"); b.classList.remove("active"); if (sortState.key === ENG_KEY) (sortState.dir === "desc" ? t : b).classList.add("active"); }
    }
    document.querySelectorAll("#thead [data-sk]").forEach(function (h) {
      h.addEventListener("click", function () {
        var k = h.getAttribute("data-sk");
        if (sortState.key === k) sortState.dir = sortState.dir === "desc" ? "asc" : "desc";
        else { sortState.key = k; sortState.dir = "desc"; }
        renderBody(); refreshHeader();
      });
    });
    document.querySelectorAll("#rank-toggle [data-rk]").forEach(function (b) {
      b.addEventListener("click", function () {
        sortState.key = ENG_KEY; sortState.dir = b.getAttribute("data-rk") === "top" ? "desc" : "asc";
        renderBody(); refreshHeader();
      });
    });
    refreshHeader();
  }

  KanSocial.init("youtube", render);
})();
</script>
</body>
</html>
