<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כאן חדשות · סושיאל — TikTok</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="header"></header>
<main id="main" class="main"></main>
<script src="/static/app.js"></script>
<script src="/static/glossary.js"></script>
<script>
(function () {
  var TYPE_COLOR = { Video: "var(--pf)", Photo: "var(--purp)" };
  var TYPE_HE = { Video: "וידאו", Photo: "תמונות" };

  function kpi(k) {
    var inner;
    if (k.weekly !== undefined) {
      var up = k.weekly >= 0;
      inner = '<div class="kpi-delta ' + (up ? "up" : "down") + '">' + (up ? "▲" : "▼") + " " + KS.signed(k.weekly) + (k.growth ? ' · ' + Math.abs(k.growth).toFixed(1) + '%' : '') + '<span class="sub">השבוע</span></div>';
    } else {
      var d = KS.delta(k.value, k.prev);
      inner = '<div class="kpi-delta ' + d.cls + '">' + d.arrow + " " + d.txt + '<span class="sub">מהתקופה הקודמת</span></div>';
    }
    return '<div class="kpi pf sm"><div class="kpi-top"><div class="kpi-label">' + k.label + '</div>' +
      '<span class="kpi-ic" style="background:var(--pf-bg);color:var(--pf);">' + KS.strokeIcon(k.icon) + '</span></div>' +
      '<div class="kpi-val">' + KS.fmtHtml(k.value) + '</div>' + inner + '</div>';
  }
  function stat(v, l) { return '<div class="stat"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>'; }
  function fmtDur(s) {
    s = Number(s) || 0;
    if (!s) return "";
    var m = Math.floor(s / 60), r = s % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  function render(data, app) {
    var rl = KS.RANGE_LABEL[data.range];
    var k = data.kpis;
    var kpis = [
      kpi({ label: "עוקבים", value: data.followers.value, weekly: data.followers.weekly_change, growth: data.followers.growth_pct, icon: "users" }),
      kpi({ label: "צפיות" + KS.term("views"), value: k.views.value, prev: k.views.prev, icon: "eye" }),
      kpi({ label: "לייקים", value: k.likes.value, prev: k.likes.prev, icon: "heart" }),
      kpi({ label: "שיתופים" + KS.term("shares"), value: k.shares.value, prev: k.shares.prev, icon: "share" })
    ].join("");

    var chart = KS.chart({
      dates: data.chart.dates, vbW: 700, vbH: 230,
      series: [{ color: "var(--pf)", data: data.chart.views, name: "צפיות", area: true }]
    });
    var legend = '<div class="legend"><span><span class="dot" style="background:var(--pf);"></span>צפיות</span></div>';

    var total = data.donut.video + data.donut.photo;
    function pct(v) { return total ? Math.round(v / total * 100) + "%" : "0%"; }
    var donut = KS.donutSvg(
      [{ color: "var(--pf)", value: data.donut.video }, { color: "var(--purp)", value: data.donut.photo }],
      total, "סרטונים");
    var dLegend =
      '<div class="donut-legend"><span class="sq" style="background:var(--pf);"></span><span class="name">וידאו</span><span class="val">' + data.donut.video + " · " + pct(data.donut.video) + '</span></div>' +
      '<div class="donut-legend"><span class="sq" style="background:var(--purp);"></span><span class="name">תמונות</span><span class="val">' + data.donut.photo + " · " + pct(data.donut.photo) + '</span></div>';

    // likes vs shares — daily lines over the last 14 days (hover for exact values)
    var barsChart = KS.chart({
      dates: data.bars.dates, vbW: 700, vbH: 175,
      series: [
        { color: "var(--pf)", data: data.bars.likes, name: "לייקים" },
        { color: "var(--teal)", data: data.bars.shares, name: "שיתופים" }
      ]
    });

    var s = data.summary;
    var summary = [stat("" + s.total, "סה״כ סרטונים"), stat(s.virality.toFixed(2) + "%", "ויראליות (שיתופים/צפיות)"), stat(s.save_rate.toFixed(2) + "%", "שיעור שמירה"), stat(s.wa_share_pct.toFixed(1) + "%", "מהשיתופים בוואטסאפ"), stat(s.avg_engagement.toFixed(2) + "%", "ממוצע מעורבות")].join("");

    var posts = data.posts;
    var meanV = posts.length ? posts.reduce(function (a, v) { return a + v.views; }, 0) / posts.length : 0;
    var cols = "40px 1fr 80px 88px 80px 92px 80px 78px";
    var thd = function (key, label) { return '<span class="center th-sort" data-sk="' + key + '" style="cursor:pointer;user-select:none;">' + label + '<span class="sk-ar"></span></span>'; };
    var thead = '<div class="thead" id="thead" style="display:grid;grid-template-columns:' + cols + ';gap:10px;"><span class="center">#</span><span>תוכן</span>' +
      thd("type", "סוג") + thd("views", "צפיות") + thd("likes", "לייקים") + thd("shares", "שיתופים") + thd("comments", "תגובות") + thd("engagement", "% מעורבות") + '</div>';
    var LIMIT = 40;
    var rowOf = function (p, idx) {
      var rank = idx + 1;
      var rankStyle = rank <= 3 ? "color:var(--pf);font-weight:700;" : "color:var(--faint);";
      var hlV = p.views > 2 * meanV;
      var hl = hlV ? "border-inline-start-color:var(--hi-views);background:var(--hi-views-bg);" : "";
      var pin = p.is_pinned ? '<span class="tag" style="color:var(--amber);margin-inline-start:6px;">📌 נעוץ</span>' : "";
      return '<a class="trow" href="' + KS.esc(p.url || "#") + '" target="_blank" rel="noopener" data-idx="' + idx + '" style="display:grid;grid-template-columns:' + cols + ';gap:10px;' + hl + '">' +
        '<span class="cell" style="' + rankStyle + '">' + rank + '</span>' +
        '<span style="min-width:0;"><span class="t-title">' + KS.esc(p.title) + '</span><span class="t-date">' + KS.fmtDate(p.date) + pin + KS.aiDot(p) + '</span></span>' +
        '<span class="center"><span class="tag" style="color:' + (TYPE_COLOR[p.type] || "var(--muted)") + ';">' + (TYPE_HE[p.type] || p.type) + '</span></span>' +
        '<span class="cell strong">' + KS.fmt(p.views) + '</span>' +
        '<span class="cell">' + KS.fmt(p.likes) + '</span>' +
        '<span class="cell">' + KS.fmt(p.shares) + '</span>' +
        '<span class="cell">' + KS.fmt(p.comments) + '</span>' +
        '<span class="cell strong">' + p.engagement.toFixed(1) + '%</span></a>';
    };
    var ENG_KEY = "engagement";
    // ברירת מחדל אחידה עם שאר העמודים: דירוג לפי מעורבות
    var sortState = { key: ENG_KEY, dir: "desc" };
    var displayList = [];

    function medOf(key) {
      var xs = posts.map(function (x) { return Number(x[key]) || 0; }).filter(function (v) { return v > 0; }).sort(function (a, b) { return a - b; });
      if (!xs.length) return 0;
      var m = Math.floor(xs.length / 2);
      return xs.length % 2 ? xs[m] : (xs[m - 1] + xs[m]) / 2;
    }
    function openPostModal(p) {
      var mv = medOf("views");
      var hero = '<div class="km-hero">' +
        '<div><div class="v">' + KS.fmtFull(p.views) + '</div><div class="l">צפיות</div></div>' +
        '<div><div class="v">' + KS.fmtFull(p.likes) + '</div><div class="l">לייקים</div></div>' +
        '<div><div class="v">' + p.engagement.toFixed(1) + '%</div><div class="l">מעורבות</div></div></div>';
      var inter = KS.kmSection("אינטראקציות") + '<div class="km-grid">' +
        KS.kmCell("שיתופים", KS.fmtFull(p.shares)) +
        KS.kmCell("מתוכם בוואטסאפ", KS.fmtFull(p.whatsapp_shares)) +
        KS.kmCell("תגובות", KS.fmtFull(p.comments)) +
        KS.kmCell("שמירות", KS.fmtFull(p.saves), null, "saves") +
        KS.kmCell("הורדות", KS.fmtFull(p.downloads)) +
        (p.duration_sec ? KS.kmCell("משך", fmtDur(p.duration_sec), "דק׳") : "") +
        (p.total_engagement ? KS.kmCell("סה״כ מעורבות", KS.fmtFull(p.total_engagement)) : "") + '</div>';
      var cmp = mv ? (KS.kmSection("ביחס לטיפוסי בחשבון") + '<div class="km-cmp">' + KS.kmCmp("צפיות מול חציון", p.views / mv) + '</div>') : "";
      var openBtn = p.url ? '<a class="km-open" href="' + KS.esc(p.url) + '" target="_blank" rel="noopener">פתח בטיקטוק ↗</a>' : "";
      KS.openModal({
        iconHtml: KS.fillIcon("tiktok", "#fff", 17), iconBg: "#000",
        type: "TikTok · " + (TYPE_HE[p.type] || p.type) + (p.is_pinned ? " · 📌 נעוץ" : ""), title: p.title || "(ללא כיתוב)", date: KS.fmtFullDate(p.date),
        bodyHtml: hero + inter + KS.kmAnalysis(p.analysis) + cmp + openBtn
      });
    }
    function cmpFn(a, b) {
      var key = sortState.key, dir = sortState.dir === "asc" ? 1 : -1;
      if (key === "type") return dir * String(a.type || "").localeCompare(String(b.type || ""));
      return dir * ((Number(a[key]) || 0) - (Number(b[key]) || 0));
    }
    function buildRows(list) {
      displayList = list;
      if (!list.length) return '<div style="padding:24px;text-align:center;color:var(--muted);">אין סרטונים בטווח שנבחר</div>';
      var html = list.slice(0, LIMIT).map(function (p, i) { return rowOf(p, i); }).join("");
      if (list.length > LIMIT) html += '<div id="tbl-more" style="display:none">' + list.slice(LIMIT).map(function (p, i) { return rowOf(p, i + LIMIT); }).join("") + '</div><button id="tbl-showall" class="showall-btn">הצג את כל ' + list.length + ' הסרטונים ↓</button>';
      return html;
    }
    var rows = buildRows(posts.slice().sort(cmpFn));

    document.getElementById("main").innerHTML =
      '<div class="platform-head"><span class="pf-icon" style="background:#000;">' + KS.fillIcon("tiktok", "#fff", 22) + '</span>' +
      '<div><h1>TikTok Analytics</h1><p>ניתוח ביצועי חשבון הטיקטוק של כאן חדשות · ' + rl + '</p></div></div>' +

      '<div class="grid-4 mb-s">' + kpis + '</div>' +

      '<div class="split" style="display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;margin-bottom:14px;">' +
        '<div class="panel chart"><div class="panel-head"><div><div class="panel-title">צפיות לאורך זמן</div><div class="panel-sub">מדדים יומיים</div></div>' + legend + '</div>' + chart + '</div>' +
        '<div class="panel"><div class="panel-title">סוג תוכן</div><div class="panel-sub">וידאו / תמונות</div>' +
        '<div style="display:flex;align-items:center;justify-content:center;margin:8px 0 12px;">' + donut + '</div>' + dLegend + '</div>' +
      '</div>' +

      '<div class="panel mb-s"><div class="panel-head"><div><div class="panel-title">לייקים לעומת שיתופים</div><div class="panel-sub">מדדים יומיים · 14 ימים אחרונים</div></div>' +
      '<div class="legend"><span><span class="dot" style="background:var(--pf);"></span>לייקים</span><span><span class="dot" style="background:var(--teal);"></span>שיתופים</span></div></div>' +
      barsChart + '</div>' +

      '<div class="grid-5 mb-m">' + summary + '</div>' +

      '<div class="table"><div class="table-head"><div><div class="panel-title">סרטונים מדורגים</div>' +
      '<div class="panel-sub">' + data.summary.total + ' סרטונים · ' + rl + ' · לחצו על סרטון לפירוט מלא</div></div>' +
      '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">' +
      '<div id="rank-toggle" class="ranges" style="padding:2px;"><button class="range active" data-rk="top">מצליחים ביותר</button><button class="range" data-rk="bottom">פחות מצליחים</button></div>' +
      '<div class="table-legend"><span><span class="sq" style="background:var(--hi-views);"></span>צפיות גבוהות</span></div></div></div>' +
      '<div class="table-scroll">' + thead + '<div id="tbl-body">' + rows + '</div></div></div>';
    KS.wireCharts();
    function wireShowAll() {
      var sa = document.getElementById("tbl-showall");
      if (sa) sa.addEventListener("click", function () { document.getElementById("tbl-more").style.display = ""; sa.style.display = "none"; });
    }
    wireShowAll();
    var tblBody = document.getElementById("tbl-body");
    tblBody.addEventListener("click", function (e) {
      var row = e.target.closest(".trow"); if (!row) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
      e.preventDefault();
      var idx = parseInt(row.getAttribute("data-idx"), 10);
      if (!isNaN(idx) && displayList[idx]) openPostModal(displayList[idx]);
    });
    function renderBody() { tblBody.innerHTML = buildRows(posts.slice().sort(cmpFn)); wireShowAll(); }
    function refreshHeader() {
      document.querySelectorAll("#thead [data-sk]").forEach(function (h) {
        var ar = h.querySelector(".sk-ar");
        if (ar) ar.textContent = h.getAttribute("data-sk") === sortState.key ? (sortState.dir === "desc" ? " ▼" : " ▲") : "";
      });
      var t = document.querySelector('#rank-toggle [data-rk="top"]'), b = document.querySelector('#rank-toggle [data-rk="bottom"]');
      if (t && b) { t.classList.remove("active"); b.classList.remove("active"); if (sortState.key === "views") (sortState.dir === "desc" ? t : b).classList.add("active"); }
    }
    document.querySelectorAll("#thead [data-sk]").forEach(function (h) {
      h.addEventListener("click", function () {
        var key = h.getAttribute("data-sk");
        if (sortState.key === key) sortState.dir = sortState.dir === "desc" ? "asc" : "desc";
        else { sortState.key = key; sortState.dir = "desc"; }
        renderBody(); refreshHeader();
      });
    });
    document.querySelectorAll("#rank-toggle [data-rk]").forEach(function (b) {
      b.addEventListener("click", function () {
        sortState.key = "views"; sortState.dir = b.getAttribute("data-rk") === "top" ? "desc" : "asc";
        renderBody(); refreshHeader();
      });
    });
    refreshHeader();
  }

  KanSocial.init("tiktok", render);
})();
</script>
</body>
</html>
