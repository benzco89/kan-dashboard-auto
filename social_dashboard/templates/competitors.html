<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כאן חדשות · סושיאל — מתחרים</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="header"></header>
<main id="main" class="main"></main>
<script src="/static/app.js"></script>
<script>
(function () {
  function stat(v, l) { return '<div class="stat"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>'; }

  var TYPE_HE = { IMAGE: "תמונה", VIDEO: "וידאו", CAROUSEL_ALBUM: "קרוסלה", Reel: "ריל", Photo: "תמונה", Carousel: "קרוסלה" };

  function postRow(p, withAccount) {
    var head = '<div class="hot-row-head"><span>' +
      (withAccount ? (p.is_kan ? "🔴 " : "") + KS.esc(p.name || p.username) + ' · ' : "") +
      (TYPE_HE[p.type] || KS.esc(p.type || "")) + '</span>' +
      '<span class="hot-time">' + KS.fmtDate(p.date) + (p.time ? " " + KS.esc(p.time) : "") + '</span></div>';
    var body = '<div class="hot-trig">' + KS.esc(p.caption || "(ללא כיתוב)") +
      '<br>❤️ ' + KS.fmt(p.likes) + ' · 💬 ' + KS.fmt(p.comments) + '</div>';
    return p.url
      ? '<a class="hot-row" href="' + KS.esc(p.url) + '" target="_blank" rel="noopener">' + head + body + '</a>'
      : '<div class="hot-row">' + head + body + '</div>';
  }

  var displayList = [];
  function openAccountModal(c) {
    var posts = c.posts || [];
    var body = posts.length
      ? KS.kmSection("הפוסטים החזקים בטווח · לפי מעורבות") + posts.map(function (p) { return postRow(p, false); }).join("")
      : '<div style="padding:16px;color:var(--muted);">אין פוסטים שמורים בטווח — האיסוף התחיל היום, הפיד מתמלא מיום ליום (עד 14 יום אחורה)</div>';
    KS.openModal({
      iconHtml: KS.fillIcon("ig", "#fff", 19),
      iconBg: c.is_kan ? "var(--pf)" : "linear-gradient(135deg,#feda75,#d62976 45%,#962fbf 80%)",
      type: "@" + c.username + " · " + KS.fmt(c.followers) + " עוקבים",
      title: (c.is_kan ? "🔴 " : "") + (c.name || c.username),
      date: "",
      bodyHtml: body
    });
  }

  function render(data, app) {
    var rl = KS.RANGE_LABEL[data.range];
    var s = data.summary;
    var comps = data.competitors || [];
    displayList = comps;

    var arena = data.arena || [];
    var arenaSection = arena.length
      ? '<div class="section-label"><span>🥊 הזירה · 48 השעות האחרונות</span><span></span></div>' +
        '<div class="panel mb-m"><div class="panel-sub" style="margin-bottom:10px;">הפוסטים החזקים של כל החשבונות (כולל כאן), לפי לייקים+תגובות</div>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;">' +
        arena.map(function (p) { return postRow(p, true); }).join("") + '</div></div>'
      : "";

    var stats = [
      stat("" + s.tracked, "חשבונות במעקב"),
      stat(KS.esc(s.leader || "—"), "המוביל בעוקבים"),
      stat(s.fastest ? KS.esc(s.fastest.name) + " +" + KS.fmt(s.fastest.change) : "—", "הצומח בטווח"),
      stat("#" + s.kan_rank, "המיקום של כאן")
    ].join("");

    var cols = "40px minmax(150px,1.3fr) 95px minmax(120px,1fr) 110px 85px 90px";
    var thead = '<div class="thead" style="display:grid;grid-template-columns:' + cols + ';gap:10px;">' +
      '<span class="center">#</span><span>חשבון</span><span class="center">עוקבים</span><span class="center">מגמה</span>' +
      '<span class="center">צמיחה בטווח</span><span class="center">פוסטים/יום</span><span class="center">מעורבות/1K</span></div>';

    var rows = comps.map(function (c, i) {
      var kanBg = c.is_kan ? "background:var(--pf-bg);" : "";
      var growth = "—";
      if (c.change_range) {
        var pct = c.followers ? (c.change_range / (c.followers - c.change_range) * 100) : 0;
        growth = '<span style="color:' + (c.change_range > 0 ? "var(--ok)" : "var(--bad)") + ';">' +
          KS.signed(c.change_range) + '<span style="color:var(--muted);font-size:11px;"> · ' + (pct >= 0 ? "+" : "") + pct.toFixed(2) + '%</span></span>';
      }
      var spark = (c.spark && c.spark.length > 1)
        ? '<span style="display:block;max-width:120px;margin:0 auto;">' + KS.sparkSvg(c.spark, c.is_kan ? "#F7381B" : "#8b8fa3") + '</span>'
        : '<span style="color:var(--faint);font-size:11px;">נבנית מיום ליום</span>';
      return '<div class="trow" data-idx="' + i + '" style="' + kanBg + 'display:grid;grid-template-columns:' + cols + ';gap:10px;cursor:pointer;align-items:center;">' +
        '<span class="cell" style="color:var(--faint);">' + (i + 1) + '</span>' +
        '<span style="min-width:0;"><span class="t-title">' + (c.is_kan ? "🔴 " : "") + KS.esc(c.name || c.username) + '</span>' +
        '<span class="t-date">@' + KS.esc(c.username) + (c.change_1d ? ' · היום: ' + KS.signed(c.change_1d) : "") + '</span></span>' +
        '<span class="cell strong">' + KS.fmt(c.followers) + '</span>' +
        '<span class="center">' + spark + '</span>' +
        '<span class="cell">' + growth + '</span>' +
        '<span class="cell">' + c.posts_24h + '</span>' +
        '<span class="cell">' + c.eng_per_1k.toFixed(1) + '</span></div>';
    }).join("");

    document.getElementById("main").innerHTML =
      '<div class="page-head"><div><h1>מעקב מתחרים · Instagram</h1>' +
      '<p>נתונים ציבוריים (Business Discovery) — עוקבים, קצב פרסום ומעורבות · ' + rl + '</p></div>' +
      '<div style="text-align:left;"><div class="asof-label">נתונים עד</div><div class="asof-date">' + KS.fmtFullDate(data.last_date) + '</div></div></div>' +

      '<div class="panel mb-m"><div class="grid-4">' + stats + '</div></div>' +

      arenaSection +

      '<div class="table"><div class="table-head"><div><div class="panel-title">דירוג לפי עוקבים</div>' +
      '<div class="panel-sub">מעורבות/1K = ממוצע לייקים+תגובות ל-10 הפוסטים האחרונים, מנורמל לגודל הקהל · צפיות אינן ציבוריות · לחצו על חשבון לפוסטים שלו</div></div></div>' +
      '<div class="table-scroll" id="comp-body">' + thead + rows + '</div></div>' +

      '<div class="panel-sub" style="margin-top:10px;">🔴 = כאן חדשות (מהנתונים המלאים שלנו) · שינויי עוקבים מצטברים מיום תחילת המעקב</div>';

    document.getElementById("comp-body").addEventListener("click", function (e) {
      if (e.target.closest("a")) return;  // קישור לפוסט גובר על המודל
      var row = e.target.closest(".trow"); if (!row) return;
      var idx = parseInt(row.getAttribute("data-idx"), 10);
      if (!isNaN(idx) && displayList[idx]) openAccountModal(displayList[idx]);
    });
  }

  KanSocial.init("competitors", render);
})();
</script>
</body>
</html>
