<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כאן חדשות · סושיאל — Facebook</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="header"></header>
<main id="main" class="main"></main>
<script src="/static/app.js"></script>
<script>
(function () {
  var TYPE_COLOR = { Reels: "var(--pf)", Videos: "var(--purp)", Images: "var(--teal)", Links: "var(--muted)" };

  function kpi(k) {
    var inner;
    if (k.weekly !== undefined) {
      var up = k.weekly >= 0;
      inner = '<div class="kpi-delta ' + (up ? "up" : "down") + '">' + (up ? "▲" : "▼") + " " + KS.signed(k.weekly) + (k.growth ? ' · ' + Math.abs(k.growth).toFixed(1) + '%' : '') + '<span class="sub">השבוע</span></div>';
    } else {
      var d = KS.delta(k.value, k.prev);
      inner = '<div class="kpi-delta ' + d.cls + '">' + d.arrow + " " + d.txt + '<span class="sub">מהתקופה הקודמת</span></div>';
    }
    return '<div class="kpi pf sm"><div class="kpi-top"><div class="kpi-label">' + k.label + '</div>' +
      '<span class="kpi-ic" style="background:var(--pf-bg);color:var(--pf);">' + KS.strokeIcon(k.icon) + '</span></div>' +
      '<div class="kpi-val">' + KS.fmtHtml(k.value) + '</div>' + inner + '</div>';
  }
  function stat(v, l) { return '<div class="stat"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>'; }

  function render(data, app) {
    var rl = KS.RANGE_LABEL[data.range];
    var k = data.kpis;
    var kpis = [
      kpi({ label: "עוקבים", value: data.followers.value, weekly: data.followers.weekly_change, growth: data.followers.growth_pct, icon: "users" }),
      kpi({ label: "צפיות", value: k.views.value, prev: k.views.prev, icon: "eye" }),
      kpi({ label: "חשיפה", value: k.reach.value, prev: k.reach.prev, icon: "reach" }),
      kpi({ label: "שיתופים", value: k.shares.value, prev: k.shares.prev, icon: "share" })
    ].join("");

    // when Meta stops returning reach (happened with the v25 metric removal),
    // say so instead of drawing zeros
    var reachOk = data.reach_ok !== false;
    var chartSeries = reachOk
      ? [{ color: "var(--reach)", data: data.chart.reach, name: "חשיפה" }, { color: "var(--pf)", data: data.chart.views, name: "צפיות" }]
      : [{ color: "var(--pf)", data: data.chart.views, name: "צפיות" }];
    var chart = KS.chart({ dates: data.chart.dates, vbW: 700, vbH: 230, series: chartSeries });
    var legend = '<div class="legend"><span><span class="dot" style="background:var(--pf);"></span>צפיות</span>' +
      (reachOk ? '<span><span class="dot" style="background:var(--reach);"></span>חשיפה</span>' : '') + '</div>';

    var typebars;
    if (reachOk) {
      var shownTypes = data.types.filter(function (t) { return t.count > 0; });
      var maxReach = Math.max.apply(null, shownTypes.map(function (t) { return t.reach; }).concat([1]));
      typebars = shownTypes.map(function (t) {
        return '<div class="typebar"><div class="typebar-top"><span class="typebar-name">' + t.name +
          '<span class="cnt">' + t.count + ' פוסטים</span></span><span class="typebar-val">' + KS.fmt(t.reach) + '</span></div>' +
          '<span class="typebar-track"><span class="typebar-fill" style="width:' + Math.round(t.reach / maxReach * 100) + '%;background:' + (TYPE_COLOR[t.name] || "var(--muted)") + ';"></span></span></div>';
      }).join("");
    } else {
      typebars = '<div style="padding:18px 0;color:var(--muted);font-size:13px;line-height:1.6;">נתוני חשיפה אינם מתקבלים כרגע מה-API של Meta.<br>שאר המדדים (צפיות, מעורבות) תקינים.</div>';
    }

    var s = data.summary;
    var summary = [stat("" + s.total, "סה״כ פוסטים"), stat("" + s.reels, "Reels"), stat("" + s.images, "Images"), stat(s.virality.toFixed(2) + "%", "ויראליות"), stat(s.avg_engagement.toFixed(2) + "%", "ממוצע מעורבות")].join("");

    var posts = data.posts;
    var meanV = posts.length ? posts.reduce(function (a, v) { return a + v.views; }, 0) / posts.length : 0;
    var meanR = posts.length ? posts.reduce(function (a, v) { return a + v.reach; }, 0) / posts.length : 0;
    var cols = "40px 1fr 78px 88px 88px 80px 84px 78px";
    var thd = function (key, label) { return '<span class="center th-sort" data-sk="' + key + '" style="cursor:pointer;user-select:none;">' + label + '<span class="sk-ar"></span></span>'; };
    var thead = '<div class="thead" id="thead" style="display:grid;grid-template-columns:' + cols + ';gap:10px;"><span class="center">#</span><span>כותרת</span>' +
      thd("type", "סוג") + thd("views", "צפיות") + thd("reach", "חשיפה") + thd("likes", "לייקים") + thd("shares", "שיתופים") + thd("engagement", "% מעורבות") + '</div>';
    var LIMIT = 40;
    var rowOf = function (p, idx) {
      var rank = idx + 1;
      var rankStyle = rank <= 3 ? "color:var(--pf);font-weight:700;" : "color:var(--faint);";
      var hlV = p.views > 2 * meanV, hlR = !hlV && p.reach > 2 * meanR;
      var hl = hlV ? "border-inline-start-color:var(--hi-views);background:var(--hi-views-bg);" : (hlR ? "border-inline-start-color:var(--hi-alt);background:var(--hi-alt-bg);" : "");
      return '<a class="trow" href="' + KS.esc(p.url || "#") + '" target="_blank" rel="noopener" data-idx="' + idx + '" style="display:grid;grid-template-columns:' + cols + ';gap:10px;' + hl + '">' +
        '<span class="cell" style="' + rankStyle + '">' + rank + '</span>' +
        '<span style="min-width:0;"><span class="t-title">' + KS.esc(p.title) + '</span><span class="t-date">' + KS.fmtDate(p.date) + (p.reshetb ? '<span class="ai-dot" title="תוכן רשת ב\'">🎙 רשת ב\'</span>' : "") + KS.aiDot(p) + '</span></span>' +
        '<span class="center"><span class="tag" style="color:' + (TYPE_COLOR[p.type] || "var(--muted)") + ';">' + p.type + '</span></span>' +
        '<span class="cell strong">' + KS.fmt(p.views) + '</span>' +
        '<span class="cell">' + KS.fmt(p.reach) + '</span>' +
        '<span class="cell">' + KS.fmt(p.likes) + '</span>' +
        '<span class="cell">' + KS.fmt(p.shares) + '</span>' +
        '<span class="cell strong">' + p.engagement.toFixed(1) + '%</span></a>';
    };
    var ENG_KEY = "engagement";
    var sortState = { key: ENG_KEY, dir: "desc" };
    var displayList = [];
    var srcFilter = "all";  // all | reshetb | news
    function bySource(list) {
      if (srcFilter === "reshetb") return list.filter(function (p) { return p.reshetb; });
      if (srcFilter === "news") return list.filter(function (p) { return !p.reshetb; });
      return list;
    }

    function medOf(key) {
      var xs = posts.map(function (x) { return Number(x[key]) || 0; }).filter(function (v) { return v > 0; }).sort(function (a, b) { return a - b; });
      if (!xs.length) return 0;
      var m = Math.floor(xs.length / 2);
      return xs.length % 2 ? xs[m] : (xs[m - 1] + xs[m]) / 2;
    }
    function openPostModal(p) {
      var mv = medOf("views"), msr = medOf("share_rate");
      var hero = '<div class="km-hero">' +
        '<div><div class="v">' + KS.fmtHtml(p.views) + '</div><div class="l">צפיות</div></div>' +
        '<div><div class="v">' + KS.fmtHtml(p.reach) + '</div><div class="l">חשיפה</div></div>' +
        '<div><div class="v">' + p.engagement.toFixed(1) + '%</div><div class="l">מעורבות</div></div></div>';
      var breakdown = p.love + p.haha + p.wow + p.sad + p.angry;
      var thumbs = Math.max(0, p.likes - breakdown);
      var react = breakdown > 0 ? (KS.kmSection("פילוח רגשות · " + KS.fmt(p.likes) + " תגובות") + '<div class="km-grid">' +
        KS.kmCell("👍 לייק", KS.fmtHtml(thumbs)) +
        KS.kmCell("❤️ אהבתי", KS.fmtHtml(p.love)) +
        KS.kmCell("😆 חחח", KS.fmtHtml(p.haha)) +
        KS.kmCell("😮 וואו", KS.fmtHtml(p.wow)) +
        KS.kmCell("😢 עצוב", KS.fmtHtml(p.sad)) +
        KS.kmCell("😡 כועס", KS.fmtHtml(p.angry)) + '</div>') : "";
      var inter = KS.kmSection("אינטראקציות") + '<div class="km-grid">' +
        KS.kmCell("רגשות (סה״כ)", KS.fmtHtml(p.likes)) +
        KS.kmCell("תגובות", KS.fmtHtml(p.comments)) +
        KS.kmCell("שיתופים", KS.fmtHtml(p.shares)) +
        (p.clicks ? KS.kmCell("קליקים", KS.fmtHtml(p.clicks)) : "") + '</div>';
      var watch = p.avg_watch ? (KS.kmSection("צפייה בווידאו") + '<div class="km-grid">' +
        KS.kmCell("צפייה ממוצעת", p.avg_watch.toFixed(1), "שנ׳") +
        (p.total_watch_min ? KS.kmCell("סה״כ דקות צפייה", KS.fmtHtml(p.total_watch_min)) : "") + '</div>') : "";
      var rates = KS.kmSection("שיעורים") + '<div class="km-grid">' +
        KS.kmCell("שיעור שיתוף", p.share_rate.toFixed(2) + "%") +
        KS.kmCell("% מעורבות", p.engagement.toFixed(1) + "%") + '</div>';
      var cmp = (mv || msr) ? (KS.kmSection("ביחס לטיפוסי בפלטפורמה") + '<div class="km-cmp">' +
        (mv ? KS.kmCmp("צפיות מול חציון", p.views / mv) : "") +
        (msr && p.share_rate ? KS.kmCmp("שיתוף מול חציון", p.share_rate / msr) : "") + '</div>') : "";
      var ai = KS.kmAnalysis(p.analysis);
      var openBtn = p.url ? '<a class="km-open" href="' + KS.esc(p.url) + '" target="_blank" rel="noopener">פתח בפייסבוק ↗</a>' : "";
      KS.openModal({
        iconHtml: KS.fillIcon("fb", "#fff", 19), iconBg: "var(--fb)",
        type: "Facebook · " + p.type, title: p.title || "(ללא כותרת)", date: KS.fmtFullDate(p.date),
        bodyHtml: hero + react + inter + watch + rates + cmp + ai + openBtn
      });
    }
    function cmpFn(a, b) {
      var k = sortState.key, dir = sortState.dir === "asc" ? 1 : -1;
      if (k === "type") return dir * String(a.type || "").localeCompare(String(b.type || ""));
      return dir * ((Number(a[k]) || 0) - (Number(b[k]) || 0));
    }
    function buildRows(list) {
      displayList = list;
      if (!list.length) return '<div style="padding:24px;text-align:center;color:var(--muted);">אין פוסטים בטווח שנבחר</div>';
      var html = list.slice(0, LIMIT).map(function (p, i) { return rowOf(p, i); }).join("");
      if (list.length > LIMIT) html += '<div id="tbl-more" style="display:none">' + list.slice(LIMIT).map(function (p, i) { return rowOf(p, i + LIMIT); }).join("") + '</div><button id="tbl-showall" class="showall-btn">הצג את כל ' + list.length + ' הפוסטים ↓</button>';
      return html;
    }
    var rows = buildRows(posts.slice().sort(cmpFn));

    document.getElementById("main").innerHTML =
      '<div class="platform-head"><span class="pf-icon" style="background:var(--pf);">' + KS.fillIcon("fb", "#fff", 24) + '</span>' +
      '<div><h1>Facebook Analytics</h1><p>ניתוח ביצועי עמוד הפייסבוק של כאן חדשות · ' + rl + '</p></div></div>' +

      '<div class="grid-4 mb-s">' + kpis + '</div>' +

      '<div class="split" style="display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;margin-bottom:14px;align-items:start;">' +
        '<div class="panel chart"><div class="panel-head"><div><div class="panel-title">צפיות וחשיפה לאורך זמן</div><div class="panel-sub">מדדים יומיים</div></div>' + legend + '</div>' + chart + '</div>' +
        '<div class="panel"><div class="panel-title">חשיפה לפי סוג</div><div class="panel-sub" style="margin-bottom:16px;">חשיפה לפי סוג תוכן</div>' + typebars + '</div>' +
      '</div>' +

      '<div class="grid-5 mb-m">' + summary + '</div>' +

      '<div class="table"><div class="table-head"><div><div class="panel-title">פוסטים מדורגים לפי מעורבות</div>' +
      '<div class="panel-sub">' + data.summary.total + ' פוסטים · ' + rl + ' · לחצו על פוסט לפירוט מלא</div></div>' +
      '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">' +
      (posts.some(function (p) { return p.reshetb; })
        ? '<div id="src-toggle" class="ranges" style="padding:2px;"><button class="range active" data-src="all">הכל</button>' +
          '<button class="range" data-src="reshetb">🎙 רשת ב\'</button>' +
          '<button class="range" data-src="news">בלי רשת ב\'</button></div>'
        : "") +
      '<div id="rank-toggle" class="ranges" style="padding:2px;"><button class="range active" data-rk="top">מצליחים ביותר</button><button class="range" data-rk="bottom">פחות מצליחים</button></div>' +
      '<div class="table-legend"><span><span class="sq" style="background:var(--hi-views);"></span>צפיות גבוהות</span>' +
      '<span><span class="sq" style="background:var(--hi-alt);"></span>חשיפה גבוהה</span></div></div></div>' +
      '<div class="table-scroll">' + thead + '<div id="tbl-body">' + rows + '</div></div></div>';
    KS.wireCharts();
    function wireShowAll() {
      var sa = document.getElementById("tbl-showall");
      if (sa) sa.addEventListener("click", function () { document.getElementById("tbl-more").style.display = ""; sa.style.display = "none"; });
    }
    wireShowAll();
    var tblBody = document.getElementById("tbl-body");
    tblBody.addEventListener("click", function (e) {
      var row = e.target.closest(".trow"); if (!row) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
      e.preventDefault();
      var idx = parseInt(row.getAttribute("data-idx"), 10);
      if (!isNaN(idx) && displayList[idx]) openPostModal(displayList[idx]);
    });
    function renderBody() { tblBody.innerHTML = buildRows(bySource(posts.slice()).sort(cmpFn)); wireShowAll(); }
    document.querySelectorAll("#src-toggle [data-src]").forEach(function (b) {
      b.addEventListener("click", function () {
        document.querySelectorAll("#src-toggle [data-src]").forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active");
        srcFilter = b.getAttribute("data-src");
        renderBody();
      });
    });
    function refreshHeader() {
      document.querySelectorAll("#thead [data-sk]").forEach(function (h) {
        var ar = h.querySelector(".sk-ar");
        if (ar) ar.textContent = h.getAttribute("data-sk") === sortState.key ? (sortState.dir === "desc" ? " ▼" : " ▲") : "";
      });
      var t = document.querySelector('#rank-toggle [data-rk="top"]'), b = document.querySelector('#rank-toggle [data-rk="bottom"]');
      if (t && b) { t.classList.remove("active"); b.classList.remove("active"); if (sortState.key === ENG_KEY) (sortState.dir === "desc" ? t : b).classList.add("active"); }
    }
    document.querySelectorAll("#thead [data-sk]").forEach(function (h) {
      h.addEventListener("click", function () {
        var k = h.getAttribute("data-sk");
        if (sortState.key === k) sortState.dir = sortState.dir === "desc" ? "asc" : "desc";
        else { sortState.key = k; sortState.dir = "desc"; }
        renderBody(); refreshHeader();
      });
    });
    document.querySelectorAll("#rank-toggle [data-rk]").forEach(function (b) {
      b.addEventListener("click", function () {
        sortState.key = ENG_KEY; sortState.dir = b.getAttribute("data-rk") === "top" ? "desc" : "asc";
        renderBody(); refreshHeader();
      });
    });
    refreshHeader();
  }

  KanSocial.init("facebook", render);
})();
</script>
</body>
</html>
