<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כאן חדשות · סושיאל — Instagram</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="header"></header>
<main id="main" class="main"></main>
<script src="/static/app.js"></script>
<script>
(function () {
  var TYPE_COLOR = { Reel: "var(--pf)", Photo: "var(--amber)", Carousel: "var(--purp)" };

  function kpi(k) {
    var inner;
    if (k.weekly !== undefined) {
      var up = k.weekly >= 0;
      inner = '<div class="kpi-delta ' + (up ? "up" : "down") + '">' + (up ? "▲" : "▼") + " " + KS.signed(k.weekly) + (k.growth ? ' · ' + Math.abs(k.growth).toFixed(1) + '%' : '') + '<span class="sub">השבוע</span></div>';
    } else {
      var d = KS.delta(k.value, k.prev);
      inner = '<div class="kpi-delta ' + d.cls + '">' + d.arrow + " " + d.txt + '<span class="sub">מהתקופה הקודמת</span></div>';
    }
    return '<div class="kpi pf sm"><div class="kpi-top"><div class="kpi-label">' + k.label + '</div>' +
      '<span class="kpi-ic" style="background:var(--pf-bg);color:var(--pf);">' + KS.strokeIcon(k.icon) + '</span></div>' +
      '<div class="kpi-val">' + KS.fmtHtml(k.value) + '</div>' + inner + '</div>';
  }
  function stat(v, l) { return '<div class="stat"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>'; }

  function render(data, app) {
    var rl = KS.RANGE_LABEL[data.range];
    var k = data.kpis;
    var kpis = [
      kpi({ label: "עוקבים", value: data.followers.value, weekly: data.followers.weekly_change, growth: data.followers.growth_pct, icon: "users" }),
      kpi({ label: "צפיות", value: k.views.value, prev: k.views.prev, icon: "eye" }),
      kpi({ label: "שמירות", value: k.saved.value, prev: k.saved.prev, icon: "save" }),
      kpi({ label: "שיתופים", value: k.shares.value, prev: k.shares.prev, icon: "share" })
    ].join("");

    // when Meta stops returning reach (happened with the v25 metric removal),
    // say so instead of drawing zeros
    var reachOk = data.reach_ok !== false;
    var chartSeries = reachOk
      ? [{ color: "var(--reach)", data: data.chart.reach, name: "חשיפה" }, { color: "var(--pf)", data: data.chart.views, name: "צפיות" }]
      : [{ color: "var(--pf)", data: data.chart.views, name: "צפיות" }];
    var chart = KS.chart({ dates: data.chart.dates, vbW: 700, vbH: 230, series: chartSeries });
    var legend = '<div class="legend"><span><span class="dot" style="background:var(--pf);"></span>צפיות</span>' +
      (reachOk ? '<span><span class="dot" style="background:var(--reach);"></span>חשיפה</span>' : '') + '</div>';

    var total = data.donut.reel + data.donut.photo + data.donut.carousel;
    function pct(v) { return total ? Math.round(v / total * 100) + "%" : "0%"; }
    var donut = KS.donutSvg(
      [{ color: "var(--pf)", value: data.donut.reel }, { color: "var(--amber)", value: data.donut.photo }, { color: "var(--purp)", value: data.donut.carousel }],
      total, "פוסטים");
    var dLegend =
      '<div class="donut-legend"><span class="sq" style="background:var(--pf);"></span><span class="name">Reel</span><span class="val">' + data.donut.reel + " · " + pct(data.donut.reel) + '</span></div>' +
      '<div class="donut-legend"><span class="sq" style="background:var(--amber);"></span><span class="name">Photo</span><span class="val">' + data.donut.photo + " · " + pct(data.donut.photo) + '</span></div>' +
      '<div class="donut-legend"><span class="sq" style="background:var(--purp);"></span><span class="name">Carousel</span><span class="val">' + data.donut.carousel + " · " + pct(data.donut.carousel) + '</span></div>';

    // saves vs shares — daily lines over the last 14 days (hover for exact values)
    var barsChart = KS.chart({
      dates: data.bars.dates, vbW: 700, vbH: 175,
      series: [
        { color: "var(--pf)", data: data.bars.saved, name: "שמירות" },
        { color: "var(--reach)", data: data.bars.shares, name: "שיתופים" }
      ]
    });

    var s = data.summary;
    var summary = [
      stat("" + s.total, "סה״כ פוסטים"),
      stat("" + s.reels, "Reels"),
      stat(s.avg_engagement.toFixed(2) + "%", "ממוצע מעורבות"),
      stat(s.virality.toFixed(2) + "%", "ויראליות"),
      stat(s.save_rate.toFixed(2) + "%", "שיעור שמירה"),
      stat(s.avg_skip_rate ? s.avg_skip_rate.toFixed(1) + "%" : "—", "Skip% ממוצע (הוק)"),
      stat(s.fb_views_share ? s.fb_views_share.toFixed(1) + "%" : "—", "צפיות רילס מפייסבוק")
    ].join("");

    var posts = data.posts;
    var meanV = posts.length ? posts.reduce(function (a, v) { return a + v.views; }, 0) / posts.length : 0;
    var meanR = posts.length ? posts.reduce(function (a, v) { return a + v.reach; }, 0) / posts.length : 0;
    var cols = "40px 1fr 80px 88px 88px 80px 84px 70px 78px";
    var thd = function (key, label) { return '<span class="center th-sort" data-sk="' + key + '" style="cursor:pointer;user-select:none;">' + label + '<span class="sk-ar"></span></span>'; };
    var thead = '<div class="thead" id="thead" style="display:grid;grid-template-columns:' + cols + ';gap:10px;"><span class="center">#</span><span>תיאור</span>' +
      thd("type", "סוג") + thd("views", "צפיות") + thd("reach", "חשיפה") + thd("saved", "שמירות") + thd("shares", "שיתופים") + thd("skip_rate", "Skip%") + thd("engagement", "% מעורבות") + '</div>';
    var LIMIT = 40;
    var rowOf = function (p, idx) {
      var rank = idx + 1;
      var rankStyle = rank <= 3 ? "color:var(--pf);font-weight:700;" : "color:var(--faint);";
      var hlV = p.views > 2 * meanV, hlR = !hlV && p.reach > 2 * meanR;
      var hl = hlV ? "border-inline-start-color:var(--hi-views);background:var(--hi-views-bg);" : (hlR ? "border-inline-start-color:var(--hi-alt);background:var(--hi-alt-bg);" : "");
      return '<a class="trow" href="' + KS.esc(p.url || "#") + '" target="_blank" rel="noopener" data-idx="' + idx + '" style="display:grid;grid-template-columns:' + cols + ';gap:10px;' + hl + '">' +
        '<span class="cell" style="' + rankStyle + '">' + rank + '</span>' +
        '<span style="min-width:0;"><span class="t-title">' + (p.analysis ? '<span class="ai-dot" title="יש ניתוח שיחה">💬</span>' : '') + KS.esc(p.title) + '</span><span class="t-date">' + KS.fmtDate(p.date) + '</span></span>' +
        '<span class="center"><span class="tag" style="color:' + (TYPE_COLOR[p.type] || "var(--muted)") + ';">' + p.type + '</span></span>' +
        '<span class="cell strong">' + KS.fmt(p.views) + '</span>' +
        '<span class="cell">' + KS.fmt(p.reach) + '</span>' +
        '<span class="cell">' + KS.fmt(p.saved) + '</span>' +
        '<span class="cell">' + KS.fmt(p.shares) + '</span>' +
        '<span class="cell">' + (p.skip_rate ? p.skip_rate.toFixed(1) + '%' : '—') + '</span>' +
        '<span class="cell strong">' + p.engagement.toFixed(1) + '%</span></a>';
    };
    var ENG_KEY = "engagement";
    var sortState = { key: ENG_KEY, dir: "desc" };
    var displayList = [];

    // median of a field across the loaded posts, for the "vs typical" context
    function medOf(key) {
      var xs = posts.map(function (x) { return Number(x[key]) || 0; }).filter(function (v) { return v > 0; }).sort(function (a, b) { return a - b; });
      if (!xs.length) return 0;
      var m = Math.floor(xs.length / 2);
      return xs.length % 2 ? xs[m] : (xs[m - 1] + xs[m]) / 2;
    }
    function openPostModal(p) {
      var mv = medOf("views"), msr = medOf("save_rate");
      var hero = '<div class="km-hero">' +
        '<div><div class="v">' + KS.fmtHtml(p.views) + '</div><div class="l">צפיות</div></div>' +
        '<div><div class="v">' + KS.fmtHtml(p.reach) + '</div><div class="l">חשיפה</div></div>' +
        '<div><div class="v">' + p.engagement.toFixed(1) + '%</div><div class="l">מעורבות</div></div></div>';
      var inter = KS.kmSection("אינטראקציות") + '<div class="km-grid">' +
        KS.kmCell("לייקים", KS.fmtHtml(p.likes)) +
        KS.kmCell("תגובות", KS.fmtHtml(p.comments)) +
        KS.kmCell("שמירות", KS.fmtHtml(p.saved)) +
        KS.kmCell("שיתופים", KS.fmtHtml(p.shares)) +
        (p.reposts ? KS.kmCell("שיתופים חוזרים", KS.fmtHtml(p.reposts)) : "") +
        KS.kmCell("סה״כ אינטראקציות", KS.fmtHtml(p.total_interactions)) + '</div>';
      var rates = KS.kmSection("שיעורים") + '<div class="km-grid">' +
        KS.kmCell("שיעור שמירה", p.save_rate.toFixed(2) + "%") +
        KS.kmCell("שיעור שיתוף", p.share_rate.toFixed(2) + "%") +
        (p.skip_rate ? KS.kmCell("Skip% (הוק)", p.skip_rate.toFixed(1) + "%") : "") +
        (p.avg_watch ? KS.kmCell("צפייה ממוצעת", p.avg_watch.toFixed(1), "שנ׳") : "") + '</div>';
      var cross = (p.fb_views || p.total_views) ? (KS.kmSection("קרוספוסט לפייסבוק") + '<div class="km-grid">' +
        KS.kmCell("צפיות בפייסבוק", KS.fmtHtml(p.fb_views)) +
        KS.kmCell("צפיות כולל (IG+FB)", KS.fmtHtml(p.total_views || (p.views + p.fb_views))) +
        KS.kmCell("% צפיות מפייסבוק", p.fb_share.toFixed(1) + "%") + '</div>') : "";
      var cmp = (mv || msr) ? (KS.kmSection("ביחס לטיפוסי בפלטפורמה") + '<div class="km-cmp">' +
        (mv ? KS.kmCmp("צפיות מול חציון", p.views / mv) : "") +
        (msr && p.save_rate ? KS.kmCmp("שמירה מול חציון", p.save_rate / msr) : "") + '</div>') : "";
      var ai = "";
      if (p.analysis) {
        var an = p.analysis;
        var senti = '<div class="km-senti"><div class="bar">' +
          '<span class="pos" style="width:' + an.pos + '%"></span>' +
          '<span class="neu" style="width:' + an.neu + '%"></span>' +
          '<span class="neg" style="width:' + an.neg + '%"></span></div>' +
          '<div class="legend"><span class="p">חיובי ' + an.pos + '%</span><span>ניטרלי ' + an.neu + '%</span><span class="n">שלילי ' + an.neg + '%</span></div></div>';
        var themes = an.themes.length ? '<div class="km-themes">' + an.themes.map(function (t) { return '<span class="km-theme">' + KS.esc(t) + '</span>'; }).join("") + '</div>' : "";
        var quotes = an.top_comments.length ? '<div class="km-quotes">' + an.top_comments.map(function (q) { return '<div class="km-quote">' + KS.esc(q) + '</div>'; }).join("") + '</div>' : "";
        ai = KS.kmSection("ניתוח שיחה · AI" + (an.controversy ? " · 🔥 שיחה טעונה" : "")) +
          senti + (an.why ? '<p class="km-why">' + KS.esc(an.why) + '</p>' : "") + themes + quotes +
          '<div class="km-ai-note">מבוסס על ' + an.n + ' תגובות · ניתוח Gemini</div>';
      }
      var openBtn = p.url ? '<a class="km-open" href="' + KS.esc(p.url) + '" target="_blank" rel="noopener">פתח באינסטגרם ↗</a>' : "";
      KS.openModal({
        iconHtml: KS.fillIcon("ig", "#fff", 19),
        iconBg: "linear-gradient(135deg,#feda75,#d62976 45%,#962fbf 80%)",
        type: "Instagram · " + p.type,
        title: p.title || "(ללא כותרת)",
        date: KS.fmtFullDate(p.date),
        bodyHtml: hero + inter + rates + cross + cmp + ai + openBtn
      });
    }
    function medStory(key) {
      var arr = (data.stories && data.stories.stories) || [];
      var xs = arr.map(function (x) { return Number(x[key]) || 0; }).filter(function (v) { return v > 0; }).sort(function (a, b) { return a - b; });
      if (!xs.length) return 0;
      var m = Math.floor(xs.length / 2);
      return xs.length % 2 ? xs[m] : (xs[m - 1] + xs[m]) / 2;
    }
    function openStoryModal(st) {
      var mv = medStory("views");
      var hero = '<div class="km-hero">' +
        '<div><div class="v">' + KS.fmtHtml(st.views) + '</div><div class="l">צפיות</div></div>' +
        '<div><div class="v">' + KS.fmtHtml(st.reach) + '</div><div class="l">חשיפה</div></div>' +
        '<div><div class="v">' + st.exit_rate.toFixed(1) + '%</div><div class="l">נטישה</div></div></div>';
      var navSec = KS.kmSection("ניווט") + '<div class="km-grid">' +
        KS.kmCell("חזרה אחורה", KS.fmtHtml(st.taps_back)) +
        KS.kmCell("דילוג קדימה", KS.fmtHtml(st.taps_forward)) +
        KS.kmCell("מעבר לחשבון הבא", KS.fmtHtml(st.swipes_forward)) +
        KS.kmCell("יציאה", KS.fmtHtml(st.exits)) + '</div>';
      var conv = KS.kmSection("המרה ומעורבות") + '<div class="km-grid">' +
        KS.kmCell("ביקורי פרופיל", KS.fmtHtml(st.profile_visits)) +
        KS.kmCell("עוקבים חדשים", KS.fmtHtml(st.follows)) +
        KS.kmCell("תגובות", KS.fmtHtml(st.replies)) +
        KS.kmCell("שיתופים", KS.fmtHtml(st.shares)) +
        (st.pv_rate ? KS.kmCell("% ביקורי פרופיל", st.pv_rate.toFixed(2) + "%") : "") + '</div>';
      var cmp = mv ? (KS.kmSection("ביחס לטיפוסי בסטוריז") + '<div class="km-cmp">' + KS.kmCmp("צפיות מול חציון", st.views / mv) + '</div>') : "";
      var openBtn = st.url ? '<a class="km-open" href="' + KS.esc(st.url) + '" target="_blank" rel="noopener">פתח באינסטגרם ↗</a>' : "";
      KS.openModal({
        iconHtml: KS.fillIcon("ig", "#fff", 19),
        iconBg: "linear-gradient(135deg,#feda75,#d62976 45%,#962fbf 80%)",
        type: "Instagram Story · " + (st.type === "Video" ? "וידאו" : "תמונה"),
        title: "סטורי · " + (st.time || ""), date: KS.fmtFullDate(st.date),
        bodyHtml: hero + navSec + conv + cmp + openBtn
      });
    }
    function cmpFn(a, b) {
      var k = sortState.key, dir = sortState.dir === "asc" ? 1 : -1;
      if (k === "type") return dir * String(a.type || "").localeCompare(String(b.type || ""));
      return dir * ((Number(a[k]) || 0) - (Number(b[k]) || 0));
    }
    function buildRows(list) {
      displayList = list;
      if (!list.length) return '<div style="padding:24px;text-align:center;color:var(--muted);">אין פוסטים בטווח שנבחר</div>';
      var html = list.slice(0, LIMIT).map(function (p, i) { return rowOf(p, i); }).join("");
      if (list.length > LIMIT) html += '<div id="tbl-more" style="display:none">' + list.slice(LIMIT).map(function (p, i) { return rowOf(p, i + LIMIT); }).join("") + '</div><button id="tbl-showall" class="showall-btn">הצג את כל ' + list.length + ' הפוסטים ↓</button>';
      return html;
    }
    var rows = buildRows(posts.slice().sort(cmpFn));

    // ---- stories section (folded in from the retired /stories page) ----
    var stdata = data.stories || {};
    var storiesSection = "";
    if (stdata.kpis && stdata.kpis.stories > 0) {
      var sk = stdata.kpis, ss = stdata.summary;
      var sStats = [
        stat("" + sk.stories, "סטוריז"),
        stat(KS.fmt(ss.avg_views), "צפיות ממוצעות"),
        stat(KS.fmt(sk.profile_visits), "ביקורי פרופיל"),
        stat(ss.avg_exit_rate.toFixed(1) + "%", "שיעור נטישה")
      ].join("");
      var NAV_META = [
        { key: "taps_back", label: "חזרה אחורה", hint: "עניין", color: "var(--ok)" },
        { key: "taps_forward", label: "דילוג קדימה", hint: "קפצו הלאה", color: "var(--amber)" },
        { key: "swipes_forward", label: "מעבר לחשבון הבא", hint: "נטשו", color: "var(--bad)" },
        { key: "exits", label: "יציאה", hint: "סגרו", color: "var(--muted)" }
      ];
      var navTotal = NAV_META.reduce(function (a, m) { return a + (stdata.nav[m.key] || 0); }, 0) || 1;
      var navBars = NAV_META.map(function (m) {
        var v = stdata.nav[m.key] || 0;
        return '<div class="typebar"><div class="typebar-top"><span class="typebar-name">' + m.label +
          '<span class="cnt">' + m.hint + '</span></span><span class="typebar-val">' + KS.fmt(v) + '</span></div>' +
          '<span class="typebar-track"><span class="typebar-fill" style="width:' + Math.round(v / navTotal * 100) + '%;background:' + m.color + ';"></span></span></div>';
      }).join("");
      var STYPE_HE = { Video: "וידאו", Image: "תמונה" };
      var scols = "40px 1fr 72px 84px 84px";
      var storyRows = stdata.stories.slice(0, 5).map(function (st, i) {
        return '<a class="trow story-row" href="' + KS.esc(st.url || "#") + '" target="_blank" rel="noopener" data-sidx="' + i + '" style="display:grid;grid-template-columns:' + scols + ';gap:10px;">' +
          '<span class="cell" style="color:var(--faint);">' + (i + 1) + '</span>' +
          '<span style="min-width:0;"><span class="t-title">סטורי · ' + KS.esc(st.time) + '</span><span class="t-date">' + KS.fmtDate(st.date) + '</span></span>' +
          '<span class="center"><span class="tag" style="color:var(--pf);">' + (STYPE_HE[st.type] || st.type) + '</span></span>' +
          '<span class="cell strong">' + KS.fmt(st.views) + '</span>' +
          '<span class="cell">' + st.exit_rate.toFixed(1) + '%</span></a>';
      }).join("");
      var storyThead = '<div class="thead" style="display:grid;grid-template-columns:' + scols + ';gap:10px;"><span class="center">#</span><span>סטורי</span><span class="center">סוג</span><span class="center">צפיות</span><span class="center">נטישה%</span></div>';
      storiesSection =
        '<div class="section-label"><span>סטוריז אינסטגרם</span><span></span></div>' +
        '<div class="split" style="display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;margin-bottom:14px;align-items:start;">' +
          '<div class="table"><div class="table-head"><div><div class="panel-title">סטוריז מובילים</div>' +
          '<div class="panel-sub">' + sk.stories + ' סטוריז · נאספים פעם ביום · לחצו לפירוט מלא</div></div></div>' +
          '<div class="grid-4" style="padding:12px 12px 4px;">' + sStats + '</div>' +
          '<div class="table-scroll" id="story-body">' + storyThead + storyRows + '</div></div>' +
          '<div class="panel"><div class="panel-title">ניווט בסטוריז</div>' +
          '<div class="panel-sub" style="margin-bottom:14px;">מה הצופים עשו · נטישה ממוצעת <b style="color:' + (ss.avg_exit_rate > 20 ? "var(--bad)" : "var(--ok)") + ';">' + ss.avg_exit_rate.toFixed(1) + '%</b></div>' + navBars + '</div>' +
        '</div>';
    }

    document.getElementById("main").innerHTML =
      '<div class="platform-head"><span class="pf-icon" style="background:linear-gradient(135deg,#feda75,#d62976 45%,#962fbf 80%);">' + KS.fillIcon("ig", "#fff", 24) + '</span>' +
      '<div><h1>Instagram Analytics</h1><p>ניתוח ביצועי עמוד האינסטגרם של כאן חדשות · ' + rl + '</p></div></div>' +

      '<div class="grid-4 mb-s">' + kpis + '</div>' +

      '<div class="split" style="display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;margin-bottom:14px;">' +
        '<div class="panel chart"><div class="panel-head"><div><div class="panel-title">צפיות וחשיפה לאורך זמן</div><div class="panel-sub">מדדים יומיים</div></div>' + legend + '</div>' + chart + '</div>' +
        '<div class="panel"><div class="panel-title">סוג תוכן</div><div class="panel-sub">Reel / Photo / Carousel</div>' +
        '<div style="display:flex;align-items:center;justify-content:center;margin:8px 0 12px;">' + donut + '</div>' + dLegend + '</div>' +
      '</div>' +

      '<div class="panel mb-s"><div class="panel-head"><div><div class="panel-title">שמירות לעומת שיתופים</div><div class="panel-sub">מדדים יומיים · 14 ימים אחרונים</div></div>' +
      '<div class="legend"><span><span class="dot" style="background:var(--pf);"></span>שמירות</span><span><span class="dot" style="background:var(--reach);"></span>שיתופים</span></div></div>' +
      barsChart + '</div>' +

      '<div class="grid-4 mb-m">' + summary + '</div>' +

      storiesSection +

      '<div class="table"><div class="table-head"><div><div class="panel-title">פוסטים מדורגים לפי מעורבות</div>' +
      '<div class="panel-sub">' + data.summary.total + ' פוסטים · ' + rl + ' · לחצו על פוסט לפירוט מלא</div></div>' +
      '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">' +
      '<div id="rank-toggle" class="ranges" style="padding:2px;"><button class="range active" data-rk="top">מצליחים ביותר</button><button class="range" data-rk="bottom">פחות מצליחים</button></div>' +
      '<div class="table-legend"><span><span class="sq" style="background:var(--hi-views);"></span>צפיות גבוהות</span>' +
      '<span><span class="sq" style="background:var(--hi-alt);"></span>חשיפה גבוהה</span></div></div></div>' +
      '<div class="table-scroll">' + thead + '<div id="tbl-body">' + rows + '</div></div></div>';
    KS.wireCharts();
    function wireShowAll() {
      var sa = document.getElementById("tbl-showall");
      if (sa) sa.addEventListener("click", function () { document.getElementById("tbl-more").style.display = ""; sa.style.display = "none"; });
    }
    wireShowAll();
    var tblBody = document.getElementById("tbl-body");
    // click a row -> full drill-down card; modifier/middle click still opens the post
    tblBody.addEventListener("click", function (e) {
      var row = e.target.closest(".trow"); if (!row) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
      e.preventDefault();
      var idx = parseInt(row.getAttribute("data-idx"), 10);
      if (!isNaN(idx) && displayList[idx]) openPostModal(displayList[idx]);
    });
    var storyBody = document.getElementById("story-body");
    if (storyBody) {
      storyBody.addEventListener("click", function (e) {
        var row = e.target.closest(".story-row"); if (!row) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
        e.preventDefault();
        var i = parseInt(row.getAttribute("data-sidx"), 10);
        var st = ((data.stories && data.stories.stories) || [])[i];
        if (st) openStoryModal(st);
      });
    }
    function renderBody() { tblBody.innerHTML = buildRows(posts.slice().sort(cmpFn)); wireShowAll(); }
    function refreshHeader() {
      document.querySelectorAll("#thead [data-sk]").forEach(function (h) {
        var ar = h.querySelector(".sk-ar");
        if (ar) ar.textContent = h.getAttribute("data-sk") === sortState.key ? (sortState.dir === "desc" ? " ▼" : " ▲") : "";
      });
      var t = document.querySelector('#rank-toggle [data-rk="top"]'), b = document.querySelector('#rank-toggle [data-rk="bottom"]');
      if (t && b) { t.classList.remove("active"); b.classList.remove("active"); if (sortState.key === ENG_KEY) (sortState.dir === "desc" ? t : b).classList.add("active"); }
    }
    document.querySelectorAll("#thead [data-sk]").forEach(function (h) {
      h.addEventListener("click", function () {
        var k = h.getAttribute("data-sk");
        if (sortState.key === k) sortState.dir = sortState.dir === "desc" ? "asc" : "desc";
        else { sortState.key = k; sortState.dir = "desc"; }
        renderBody(); refreshHeader();
      });
    });
    document.querySelectorAll("#rank-toggle [data-rk]").forEach(function (b) {
      b.addEventListener("click", function () {
        sortState.key = ENG_KEY; sortState.dir = b.getAttribute("data-rk") === "top" ? "desc" : "asc";
        renderBody(); refreshHeader();
      });
    });
    refreshHeader();
  }

  KanSocial.init("instagram", render);
})();
</script>
</body>
</html>
