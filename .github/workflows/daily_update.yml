name: Daily Social Update

on:
  # התזמון מנוהל אמין ע"י systemd timer ב-VPS (kan-daily-dispatch.timer, 08:30 שעון ישראל)
  # שמפעיל workflow_dispatch דרך ה-API. ה-cron של GitHub עצמו רץ באיחור של 4-6 שעות, לכן הוסר.
  workflow_dispatch:      # מופעל ע"י ה-VPS ב-08:30, וגם כפתור ידני

jobs:
  collect:
    name: Collect Data
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # כל שלבי האיסוף עם continue-on-error כדי שכשל באחד לא ימנע את השאר;
      # שלב הסיכום בסוף שולח התראת טלגרם ומכשיל את ה-run אם משהו נפל.

      # שלב 1: מעקב עוקבים - רץ ראשון כי הכי מהיר
      - name: Track Followers
        id: followers
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GETXAPI_KEY: ${{ secrets.GETXAPI_KEY }}  # לעוקבי טוויטר (מוגן: בלי מפתח -> ריק)
        run: python followers_tracker.py

      # שלב 2: איסוף יוטיוב (בלי טלגרם)
      - name: Collect YouTube Data
        id: youtube
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: python youtube_collector.py

      # שלב 3: איסוף פייסבוק
      - name: Collect Facebook Data
        id: facebook
        continue-on-error: true
        env:
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: python facebook_collector.py

      # שלב 4: איסוף אינסטגרם
      - name: Collect Instagram Data
        id: instagram
        continue-on-error: true
        env:
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: python instagram_collector.py

      # שלב 4.2: איסוף סטוריז אינסטגרם (חלון 24 שעות - מה שלא נאסף הבוקר אבוד).
      # best-effort בתקופת ההרצה הראשונה: כשל מדווח בהתראה אבל לא מכשיל את ה-run
      - name: Collect Instagram Stories
        id: stories
        continue-on-error: true
        env:
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: python stories_collector.py

      # שלב 4.5: איסוף טוויטר/X (GetXAPI) - best-effort: כשל פה (מכסה/קוטה)
      # מדווח בהתראה אבל לא מכשיל את ה-run
      - name: Collect Twitter Data
        id: twitter
        continue-on-error: true
        env:
          GETXAPI_KEY: ${{ secrets.GETXAPI_KEY }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          TWITTER_USERNAME: kann_news
        run: python twitter_collector.py

      # שלב 4.7: ניתוח תגובות לפוסטים מדוברים (רץ אחרי איסוף אינסטגרם כדי
      # שהמועמדים ייבחרו מנתוני הבוקר) - best-effort: כשל לא מכשיל את ה-run
      - name: Analyze Post Comments
        id: comments
        continue-on-error: true
        env:
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python comment_analyzer.py

      # שלב 4.8: מעקב מתחרים (business discovery, נתונים ציבוריים) - best-effort
      - name: Track Competitors
        id: competitors
        continue-on-error: true
        env:
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: python competitors_collector.py

      # שלב 5: שליחת דוח טלגרם (רץ גם אם חלק מהאיסופים נכשלו - מדווח על מה שיש)
      - name: Send Telegram Report
        id: report
        continue-on-error: true
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_reporter.py

      # שלב 6: סיכום - התראה על כל שלב שנכשל; רק שלבי חובה מכשילים את ה-run
      # (טוויטר/GetXAPI הוא best-effort: מדווח בהתראה אבל לא מכשיל)
      - name: Notify on failures
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          critical=""
          optional=""
          [ "${{ steps.followers.outcome }}" = "failure" ] && critical="$critical followers"
          [ "${{ steps.youtube.outcome }}"   = "failure" ] && critical="$critical youtube"
          [ "${{ steps.facebook.outcome }}"  = "failure" ] && critical="$critical facebook"
          [ "${{ steps.instagram.outcome }}" = "failure" ] && critical="$critical instagram"
          [ "${{ steps.report.outcome }}"    = "failure" ] && critical="$critical telegram-report"
          [ "${{ steps.twitter.outcome }}"   = "failure" ] && optional="$optional twitter(best-effort)"
          [ "${{ steps.stories.outcome }}"   = "failure" ] && optional="$optional stories(best-effort)"
          [ "${{ steps.comments.outcome }}"  = "failure" ] && optional="$optional comments(best-effort)"
          [ "${{ steps.competitors.outcome }}" = "failure" ] && optional="$optional competitors(best-effort)"

          if [ -z "$critical$optional" ]; then
            echo "All steps succeeded."
            exit 0
          fi

          echo "Failed steps:$critical$optional"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⚠️ Daily Social Update - שלבים שנכשלו:${critical}${optional}
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true

          [ -z "$critical" ] && exit 0
          exit 1
