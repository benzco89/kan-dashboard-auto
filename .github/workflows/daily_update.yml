name: Daily Social Update

on:
  # התזמון מנוהל אמין ע"י systemd timer ב-VPS (kan-daily-dispatch.timer, 08:30 שעון ישראל)
  # שמפעיל workflow_dispatch דרך ה-API. ה-cron של GitHub עצמו רץ באיחור של 4-6 שעות, לכן הוסר.
  workflow_dispatch:      # מופעל ע"י ה-VPS ב-08:30, וגם כפתור ידני

jobs:
  collect:
    name: Collect Data
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # כל שלבי האיסוף עם continue-on-error כדי שכשל באחד לא ימנע את השאר;
      # שלב הסיכום בסוף שולח התראת טלגרם ומכשיל את ה-run אם משהו נפל.

      # שלב 1: מעקב עוקבים - רץ ראשון כי הכי מהיר
      - name: Track Followers
        id: followers
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GETXAPI_KEY: ${{ secrets.GETXAPI_KEY }}  # לעוקבי טוויטר (מוגן: בלי מפתח -> ריק)
        run: python followers_tracker.py

      # שלב 2: איסוף יוטיוב (בלי טלגרם)
      - name: Collect YouTube Data
        id: youtube
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: python youtube_collector.py

      # שלב 3: איסוף פייסבוק
      - name: Collect Facebook Data
        id: facebook
        continue-on-error: true
        env:
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: python facebook_collector.py

      # שלב 4: איסוף אינסטגרם
      - name: Collect Instagram Data
        id: instagram
        continue-on-error: true
        env:
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: python instagram_collector.py

      # שלב 4.5: איסוף טוויטר/X (GetXAPI) - best-effort: כשל פה (מכסה/קוטה)
      # מדווח בהתראה אבל לא מכשיל את ה-run
      - name: Collect Twitter Data
        id: twitter
        continue-on-error: true
        env:
          GETXAPI_KEY: ${{ secrets.GETXAPI_KEY }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          TWITTER_USERNAME: kann_news
        run: python twitter_collector.py

      # שלב 5: שליחת דוח טלגרם (רץ גם אם חלק מהאיסופים נכשלו - מדווח על מה שיש)
      - name: Send Telegram Report
        id: report
        continue-on-error: true
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_reporter.py

      # שלב 6: סיכום - התראה על כל שלב שנכשל + הכשלת ה-run (למעט טוויטר בלבד)
      - name: Notify on failures
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          failed=""
          [ "${{ steps.followers.outcome }}" = "failure" ] && failed="$failed followers"
          [ "${{ steps.youtube.outcome }}"   = "failure" ] && failed="$failed youtube"
          [ "${{ steps.facebook.outcome }}"  = "failure" ] && failed="$failed facebook"
          [ "${{ steps.instagram.outcome }}" = "failure" ] && failed="$failed instagram"
          [ "${{ steps.twitter.outcome }}"   = "failure" ] && failed="$failed twitter"
          [ "${{ steps.report.outcome }}"    = "failure" ] && failed="$failed telegram-report"

          if [ -z "$failed" ]; then
            echo "All steps succeeded."
            exit 0
          fi

          echo "Failed steps:$failed"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⚠️ Daily Social Update - שלבים שנכשלו:${failed}
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true

          # טוויטר לבדו הוא best-effort ולא מכשיל את ה-run
          if [ "$failed" = " twitter" ]; then
            echo "Only twitter failed (best-effort) - not failing the run."
            exit 0
          fi
          exit 1
