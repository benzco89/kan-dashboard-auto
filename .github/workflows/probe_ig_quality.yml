name: Probe Instagram video quality (read-only)

# Every Instagram file in the archive is ~720 wide while TikTok's copy of the
# same item is 1080, and Meta's own format list for those reels mentions
# 1084x1916. Is the higher rendition reachable? Read-only: writes no sheet,
# uploads nothing. Manual button only.
on:
  workflow_dispatch:
    inputs:
      posts:
        description: 'How many recent reels to sample'
        required: false
        default: '3'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      # ffprobe is NOT on the runner image by default - the first run of this
      # probe died on FileNotFoundError after a successful download.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Run reel-shape probe
        env:
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PROBE_POSTS: ${{ inputs.posts }}
        run: python ig_quality_probe.py
