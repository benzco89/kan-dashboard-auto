name: Probe Facebook video retention (read-only)

# Why views_30s / completion_rate have been 0 for months, and what v25 exposes
# in their place. Read-only: does NOT write to Google Sheets or touch the
# collectors. Manual button only.
on:
  workflow_dispatch:
    inputs:
      posts:
        description: 'How many recent video posts to sample'
        required: false
        default: '6'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Run video-retention probe
        env:
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PROBE_POSTS: ${{ github.event.inputs.posts }}
        run: python fb_video_probe.py
