name: Test YouTube Only

# מריץ רק את youtube_collector.py — בלי עוקבים, בלי שאר הרשתות ובלי טלגרם.
# נועד להשלים יום שבו שלב היוטיוב נפל ב-Daily Social Update, במקום להריץ את
# כל ה-workflow שוב (שהיה דורס את הדלתאות של פייסבוק/אינסטגרם ושולח דוח שני).
#
# זהירות: גם ליוטיוב יש views_delta — צפיות פחות ההרצה הקודמת
# (youtube_collector.py, "חישוב דלתא"). אחרי בוקר שנכשל ההרצה הקודמת היא של
# אתמול, אז הדלתא יוצאת יומית כמו שצריך. להריץ פעם אחת בלבד: הרצה נוספת
# באותו יום תחליף את הדלתא היומית בפער של כמה שעות.
on:
  workflow_dispatch:      # מאפשר הרצה ידנית בכפתור

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run YouTube Collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: python youtube_collector.py
