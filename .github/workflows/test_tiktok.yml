name: Test TikTok Only

on:
  workflow_dispatch:      # מאפשר הרצה ידנית בכפתור / gh CLI
    inputs:
      days_back:
        description: 'כמה ימים אחורה למשוך (ברירת מחדל 7; למשיכה היסטורית: 30)'
        required: false
        default: '7'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # איסוף סרטונים (בודק שה-TIKHUB_TOKEN עובד)
      - name: Run TikTok Collector
        env:
          TIKHUB_TOKEN: ${{ secrets.TIKHUB_TOKEN }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          TIKTOK_USERNAME: kan_news
          TIKTOK_DAYS_BACK: ${{ inputs.days_back }}
        run: python tiktok_collector.py
