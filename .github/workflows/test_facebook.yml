name: Test Facebook Only

on:
  workflow_dispatch:      # מאפשר הרצה ידנית בכפתור

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # הרצת פייסבוק
      - name: Run Facebook Collector
        env:
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: python facebook_collector.py

      # הרצת מעקב עוקבים - כל הפלטפורמות.
      # GETXAPI_KEY ו-TIKHUB_TOKEN חסרו כאן, והקולקטור כותב שורה אחת ליום
      # ומעדכן אותה במקום - כלומר כל הרצה ידנית של ה-workflow הזה מחקה את
      # מספרי העוקבים של X וטיקטוק מהשורה של אותו יום, בשקט. הריצות של היום
      # עשו בדיוק את זה.
      - name: Run Followers Tracker
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GETXAPI_KEY: ${{ secrets.GETXAPI_KEY }}
          TIKHUB_TOKEN: ${{ secrets.TIKHUB_TOKEN }}
        run: python followers_tracker.py
