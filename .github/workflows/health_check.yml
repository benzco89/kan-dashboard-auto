name: Health Check

on:
  schedule:
    - cron: '0 9 * * *'  # 11:00 Israel Time (2.5 hours after daily run at 08:30)
  workflow_dispatch:      # Manual trigger button

jobs:
  check:
    name: Check Data Freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # בכוונה לא requirements.txt המלא: כלב-השמירה צריך לשרוד גם כשההתקנה
      # של הצינור עצמו נשברת. אותן גרסאות נעוצות, תת-קבוצה מינימלית.
      - name: Install dependencies
        run: |
          pip install gspread==6.2.1 requests==2.34.2 pytz==2026.2

      - name: Run Health Check
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python health_check.py
