name: Test Comment Analyzer Only

on:
  workflow_dispatch:      # מאפשר הרצה ידנית בכפתור / gh CLI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ניתוח תגובות (בודק Graph API comments + Gemini + כתיבה לגיליון "ניתוח תגובות")
      - name: Run Comment Analyzer
        env:
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python comment_analyzer.py
