name: Test Comment Analyzer Only

on:
  workflow_dispatch:      # מאפשר הרצה ידנית בכפתור / gh CLI
    inputs:
      max_per_run:
        description: 'דריסת תקרת הניתוחים לפלטפורמה (ל-backfill חד-פעמי)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ניתוח תגובות (בודק Graph API comments + Gemini + כתיבה לגיליון "ניתוח תגובות")
      - name: Run Comment Analyzer
        env:
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TIKHUB_TOKEN: ${{ secrets.TIKHUB_TOKEN }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_PER_RUN: ${{ inputs.max_per_run }}
        run: python comment_analyzer.py
