services:
  - type: web
    name: kan-dashboard
    runtime: node
    region: frankfurt
    plan: free
    rootDir: dashboard
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GCP_SERVICE_ACCOUNT
        sync: false  # Set manually in Render dashboard
